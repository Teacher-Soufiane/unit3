  <style>

    .choice:hover:not(:disabled){border-color:var(--blue);background:#f5f9ff}.choice.selected{border-color:var(--blue);background:#dbeafe}.choice.correct{border-color:#16a34a;background:#dcfce7}.choice.wrong{border-color:#dc2626;background:#fee2e2}.choice:disabled{cursor:default}
    .check-btn,.nav-btn,.result-btn{border:0;border-radius:11px;padding:12px 17px;font-weight:800;cursor:pointer;transition:.18s}
    .check-btn{background:var(--blue);color:#fff;margin-top:20px}.check-btn:disabled,.nav-btn:disabled{opacity:.4;cursor:not-allowed}.check-btn:hover:not(:disabled),.nav-btn:hover:not(:disabled){filter:brightness(.94)}
    .feedback{margin-top:18px;border-left:4px solid var(--blue);background:#eff6ff;padding:14px;border-radius:8px;font-size:14px;line-height:1.55}.feedback.good{border-color:var(--green);background:#f0fdf4}.feedback.bad{border-color:var(--red);background:#fef2f2}
    .matching-row{display:grid;grid-template-columns:minmax(190px,1fr) minmax(260px,1.35fr);gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #e7edf4}.matching-row:last-child{border:0}.match-sentence{font-weight:600}.match-select{width:100%;padding:11px;border:1px solid #b9c8d9;border-radius:9px;background:#fff}.match-select.correct{border:2px solid #16a34a;background:#dcfce7}.match-select.wrong{border:2px solid #dc2626;background:#fee2e2}
    .order-list{display:grid;gap:10px}.order-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px}.drag-mark{color:#64748b;font-size:18px}.move-controls{display:flex;gap:5px}.move-btn{width:30px;height:30px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:7px;cursor:pointer}.move-btn:disabled{opacity:.4}
    .chat{display:grid;gap:11px;margin-bottom:20px}.bubble{max-width:78%;padding:13px 15px;border-radius:15px;font-weight:500;line-height:1.45}.bubble-a{background:#dbeafe;border-bottom-left-radius:3px;justify-self:start}.bubble-b{background:#ecfdf5;border-bottom-right-radius:3px;justify-self:end}.bubble.missing{border:2px dashed #93a6bc;background:#f8fafc;color:#64748b}.bubble.revealed{animation:pop .35s ease;background:#dcfce7;color:#14532d;border:none}
    @keyframes pop{0%{transform:scale(.85);opacity:.2}100%{transform:scale(1);opacity:1}}
    .function-tag{display:inline-block;background:#e0efff;color:#1d4ed8;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;margin-top:14px}
    .nav-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:20px}.nav-btn{background:var(--navy);color:#fff}.nav-next{justify-self:end}.counter{font-weight:800;color:var(--navy)}
    .stats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding:16px 6px 0;color:#334155;font-weight:700;font-size:14px}.stats strong{color:var(--navy)}
    .result-panel{padding:34px;text-align:center;position:relative}.result-kicker{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.12em}.score-badge{width:170px;height:170px;border:10px solid #bfdbfe;border-radius:50%;display:grid;place-items:center;margin:22px auto;background:#eff6ff;color:var(--navy);font-weight:800;font-size:31px}.remark{font-size:30px;font-weight:800;color:var(--navy);min-height:46px}.summary{max-width:720px;margin:23px auto;text-align:left;background:#f8fbff;border-radius:14px;padding:18px}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.summary-item{padding:10px;background:#fff;border:1px solid #e4ecf4;border-radius:9px;font-size:13px}.summary-item b{display:block;color:var(--navy);font-size:16px;margin-top:3px}.breakdown{margin-top:18px;text-align:left}.breakdown li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e2e8f0;font-size:14px}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}.result-btn{background:var(--navy);color:#fff}.result-btn.alt{background:#e0efff;color:#1e3a5f}.review-card{padding:20px;margin-bottom:16px;text-align:left}.review-card h2{font-size:18px;color:var(--navy);margin:0 0 12px}.review-line{padding:9px 0;border-bottom:1px solid #edf2f7;font-size:14px}.review-ok{color:var(--green);font-weight:700}.review-no{color:var(--red);font-weight:700}
    .confetti{position:fixed;width:10px;height:15px;top:-20px;animation:fall 3.5s linear forwards;z-index:20;pointer-events:none}@keyframes fall{to{transform:translateY(calc(100 * min(var(--vh,1vh),1vh))) rotate(720deg);opacity:0}}
    .hidden{display:none!important}
    @media(min-width:600px){.header-teacher-img,.header-logo-img{height:80px}}
    @media(min-width:1024px){.header-teacher-img,.header-logo-img{height:96px}}
    @media(max-width:640px){.header-teacher-img,.header-logo-img{height:45px}.quiz-header{padding:8px 12px;grid-template-columns:auto 1fr auto;gap:8px}.title-line1{font-size:16px}.title-line2{font-size:11px}.title-line3{font-size:10px}.info-bar{font-size:10px;padding:10px 12px}.main-content{padding:15px 10px 26px}.instruction{padding:15px;font-size:14px}.task-wrap{padding:16px}.classify-grid,.matching-row{grid-template-columns:1fr}.drop-zone{min-height:120px}.stats{justify-content:flex-start;gap:10px;font-size:12px}.summary-grid{grid-template-columns:1fr 1fr}.result-panel{padding:24px 15px}}
    @media print{.quiz-header,.info-bar,.nav-row,.stats,.result-actions,.no-print{display:none!important}body{background:#fff}.result-panel{box-shadow:none}.hidden{display:block!important}}

 <body>
  <div class="quiz-shell">

  <script>
const quizConfig={
unit:"3",title:"EXPRESSING PURPOSE",lesson:"FUNCTIONS - QUIZ 3",teacherName:"Teacher Soufiane",
teacherImage:"https://i.imgur.com/vvyZAnr.png",logo:"https://i.imgur.com/XPOYllA.png",
randomizeQuestions:false,randomizeChoices:true,timerEnabled:true,timerMode:"countup",showConfetti:true,enableSounds:true,
questions:[
{type:"drag-classify",category:"Classify the Expressions",question:"CLASSIFY THE EXPRESSIONS INTO THE CORRECT CATEGORY.",columns:["+ infinitive","+ subject + modal + verb"],tiles:[{id:"t1",text:"to",correctColumn:"+ infinitive"},{id:"t2",text:"in order to",correctColumn:"+ infinitive"},{id:"t3",text:"so as to",correctColumn:"+ infinitive"},{id:"t4",text:"so that",correctColumn:"+ subject + modal + verb"}],explanation:"'To', 'in order to', and 'so as to' are all followed directly by the infinitive form of a verb, while 'so that' is followed by a subject plus a modal verb (can/could/will/would) and then the verb.",points:2},
{type:"single-choice",category:"Choose the Correct Purpose Expression",question:"CHOOSE THE CORRECT EXPRESSION.",task:"Ahmed joined his friends in the café ______ watch the Champions League Final.",choices:["to","so that","because","although"],correctAnswer:"to",explanation:"'To' + infinitive expresses the purpose of joining his friends; 'so that' would need a subject and modal verb.",points:2},
{type:"matching",category:"Match Action & Purpose",question:"MATCH EACH ACTION WITH ITS PURPOSE.",pairs:[{id:"1",sentence:"Rachid takes care of the baby.",correctFunction:"so that his wife can focus on her studies."},{id:"2",sentence:"Reda is studying English.",correctFunction:"in order to continue his studies in the USA."},{id:"3",sentence:"She has enrolled in a medical school.",correctFunction:"in order to pursue a medical career."},{id:"4",sentence:"Mouhcine moved to the city centre.",correctFunction:"to be close to his office."}],functionOptions:["so that his wife can focus on her studies.","in order to continue his studies in the USA.","in order to pursue a medical career.","to be close to his office.","so as to improve his English."],explanation:"'So as to improve his English' is the distractor here — it doesn't correctly complete any of the four actions listed.",points:2},
{type:"single-choice",category:"Complete the Sentence",question:"COMPLETE THE SENTENCE.",task:"Rachid takes care of the baby ______ his wife can focus on her studies.",choices:["so that","in order to","so as to","because"],correctAnswer:"so that",explanation:"'So that' is followed by a subject ('his wife') and a modal verb ('can').",points:2},
{type:"drag-order",category:"Sentence Transformation",question:"DRAG THE CHUNKS INTO THE CORRECT ORDER TO BUILD THE SENTENCE USING 'SO THAT'.",lines:[{id:"c3",text:"buy a new car"},{id:"c1",text:"Alberto is saving money"},{id:"c4",text:"he can"},{id:"c2",text:"so that"}],correctOrder:["c1","c2","c4","c3"],explanation:"The full sentence is: 'Alberto is saving money so that he can buy a new car.'",points:2},
{type:"drag-order",category:"Sentence Builder",question:"DRAG THE CHUNKS INTO THE CORRECT ORDER TO BUILD THE SENTENCE USING 'SO AS TO'.",lines:[{id:"c2",text:"so as to"},{id:"c4",text:"for his holiday"},{id:"c1",text:"Bill is looking for a part-time job"},{id:"c3",text:"save some money"}],correctOrder:["c1","c2","c3","c4"],explanation:"The full sentence is: 'Bill is looking for a part-time job so as to save some money for his holiday.'",points:2},
{type:"single-choice",category:"Find the Mistake",question:"WHICH PART OF THE SENTENCE IS INCORRECT?",task:"She enrolled in a medical school so that to pursue a medical career.",choices:["so that to pursue","she enrolled in","a medical school","a medical career"],correctAnswer:"so that to pursue",explanation:"'So that' must be followed by a subject and modal verb, never directly by 'to' + infinitive.",points:2},
{type:"complete-exchange",category:"Complete the Exchange",question:"COMPLETE THE EXCHANGE APPROPRIATELY.",dialogue:[{speaker:"A",text:"What's your purpose in taking an English course?"},{speaker:"B",text:"..."}],missingSpeaker:"B",choices:["I want to improve my English.","Because English is difficult.","Although I like English.","I improved my English yesterday."],correctAnswer:"I want to improve my English.",function:"Expressing Purpose",explanation:"A explicitly asks for B's purpose, so a reason like 'because English is difficult' doesn't answer the question at all; only 'I want to improve my English' states a goal, unlike the other three which give a reason, a concession, or the wrong verb tense.",points:2},
{type:"single-choice",category:"Purpose or Reason?",question:"TO OR BECAUSE? CHOOSE THE CORRECT WORD.",task:"She went to the library ______ study.",choices:["to","because","although","but"],correctAnswer:"to",explanation:"'To' + infinitive expresses the purpose of going to the library.",points:2},
{type:"single-choice",category:"Purpose Challenge",question:"CHOOSE THE CORRECT TRANSFORMATION.",task:"Mouhcine moved to the city centre. He wanted to be close to his office. (in order to)",choices:["Mouhcine moved to the city centre in order to be close to his office.","Mouhcine moved to the city centre in order that be close to his office.","Mouhcine moved to the city centre so that to be close to his office.","Mouhcine moved to the city centre because to be close to his office."],correctAnswer:"Mouhcine moved to the city centre in order to be close to his office.",explanation:"'In order to' must be followed directly by the infinitive 'be'.",points:2}
]};

let currentIndex=0,selectedTileId=null,draggedId=null;
const state={answers:{},scores:{},attempts:Number(localStorage.getItem("purposeAttempts")||0),lastScore:Number(localStorage.getItem("purposeLastScore")||0),bestScore:Number(localStorage.getItem("purposeBestScore")||0)};
const timer={seconds:0,interval:null,running:false,start(){if(this.running)return;this.running=true;this.interval=setInterval(()=>{this.seconds++;updateStats()},1000)},pause(){this.running=false;clearInterval(this.interval)},reset(){this.pause();this.seconds=0},format(){const m=String(Math.floor(this.seconds/60)).padStart(2,"0"),s=String(this.seconds%60).padStart(2,"0");return m+":"+s}};

function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function questionState(index){return state.answers[index]||(state.answers[index]={locked:false})}
function getOrder(q,key,items){if(!q[key])q[key]=shuffle(items);return q[key]}
function totalScore(){return Object.values(state.scores).reduce((sum,value)=>sum+value,0)}
function answeredCount(){return Object.values(state.answers).filter(answer=>answer.locked).length}
function sound(type){if(!quizConfig.enableSounds)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();const notes={correct:[620,.12],wrong:[210,.16],click:[390,.05],complete:[740,.22]}[type]||[390,.05];o.frequency.value=notes[0];g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+notes[1]);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+notes[1])}
function feedbackMarkup(correct,explanation){const text=correct?"Excellent! Great job!":"Almost! Review this rule.";return `<div class="feedback ${correct?"good":"bad"}"><strong>${text}</strong><br>${explanation}</div>`}
function updateStats(){const answered=answeredCount(),correct=Object.values(state.answers).filter(a=>a.locked&&a.isCorrect).length;document.getElementById("correct-stat").textContent=correct;document.getElementById("wrong-stat").textContent=answered-correct;document.getElementById("remaining-stat").textContent=quizConfig.questions.length-answered;document.getElementById("score-stat").textContent=totalScore().toFixed(2)+" /20";document.getElementById("timer-stat").textContent=timer.format()}
function setLocked(index,score,isCorrect){const answer=questionState(index);answer.locked=true;answer.isCorrect=isCorrect;state.scores[index]=score;updateStats();sound(isCorrect?"correct":"wrong")}

function renderQuestion(){
 const q=quizConfig.questions[currentIndex],answer=questionState(currentIndex);
 document.getElementById("instruction-box").textContent=q.question;
 document.getElementById("counter").textContent=(currentIndex+1)+" / "+quizConfig.questions.length;
 document.getElementById("previous-btn").disabled=currentIndex===0;
 document.getElementById("next-btn").disabled=!answer.locked;
 document.getElementById("next-btn").textContent=currentIndex===quizConfig.questions.length-1?"Finish ▶":"Next ▶";
 if(q.type==="drag-classify")renderTypeA(q,answer);
 if(q.type==="drag-order")renderTypeB(q,answer);
 if(q.type==="matching")renderTypeC(q,answer);
 if(q.type==="single-choice")renderTypeD(q,answer);
 if(q.type==="complete-exchange")renderTypeE(q,answer);
 updateStats();
}

function renderTypeA(q,answer){
 const area=document.getElementById("task-area");answer.placements||={};const order=getOrder(q,"_displayOrder",q.tiles.map(t=>t.id));
 const tileById=Object.fromEntries(q.tiles.map(t=>[t.id,t]));
 function tileHTML(id){const t=tileById[id],placed=answer.placements[id],ok=answer.locked&&placed===t.correctColumn;const wrong=answer.locked&&!ok;return `<div class="tile ${selectedTileId===id?"selected":""} ${ok?"correct":wrong?"wrong":""}" tabindex="0" draggable="${!answer.locked}" data-tile="${id}">${t.text}${wrong?`<div class="tile-note">Correct: ${t.correctColumn}</div>`:""}${ok?`<div class="tile-note" style="color:#15803d">+${(q.points/q.tiles.length).toFixed(2)}</div>`:""}</div>`}
 let html=`<div class="pool" id="tile-pool">${order.filter(id=>!answer.placements[id]).map(tileHTML).join("")}</div><div class="classify-grid">`;
 q.columns.forEach(column=>{html+=`<div class="drop-zone" data-column="${column}" tabindex="0"><div class="drop-head">${column}</div>${order.filter(id=>answer.placements[id]===column).map(tileHTML).join("")}</div>`});html+=`</div>`;
 if(!answer.locked)html+=`<button class="check-btn" id="check-a" ${Object.keys(answer.placements).length!==q.tiles.length?"disabled":""}>Check Answers</button>`;
 if(answer.locked)html+=feedbackMarkup(answer.isCorrect,q.explanation);area.innerHTML=html;
 if(answer.locked)return;
 area.querySelectorAll("[data-tile]").forEach(el=>{el.addEventListener("dragstart",()=>{draggedId=el.dataset.tile;sound("click")});el.addEventListener("click",()=>{selectedTileId=el.dataset.tile;renderTypeA(q,answer);sound("click")});el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectedTileId=el.dataset.tile;renderTypeA(q,answer)}})});
 area.querySelectorAll("[data-column]").forEach(zone=>{zone.addEventListener("dragover",e=>{e.preventDefault();zone.classList.add("drag-over")});zone.addEventListener("dragleave",()=>zone.classList.remove("drag-over"));zone.addEventListener("drop",e=>{e.preventDefault();placeTile(draggedId,zone.dataset.column,q,answer)});zone.addEventListener("click",()=>{if(selectedTileId)placeTile(selectedTileId,zone.dataset.column,q,answer)});zone.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&selectedTileId){e.preventDefault();placeTile(selectedTileId,zone.dataset.column,q,answer)}})});
 document.getElementById("check-a").addEventListener("click",()=>{let score=0;q.tiles.forEach(t=>{if(answer.placements[t.id]===t.correctColumn)score+=q.points/q.tiles.length});setLocked(currentIndex,score,score===q.points);renderQuestion()});
}
function placeTile(id,column,q,answer){if(!id)return;answer.placements[id]=column;selectedTileId=null;draggedId=null;sound("click");renderTypeA(q,answer)}

function renderTypeB(q,answer){
 const area=document.getElementById("task-area");answer.order||=q.lines.map(line=>line.id);const map=Object.fromEntries(q.lines.map(line=>[line.id,line]));
 let html=`<div class="order-list" id="order-list">`;
 answer.order.forEach((id,index)=>{const correct=q.correctOrder[index]===id;const should=q.correctOrder.indexOf(id)+1;html+=`<div class="order-card ${answer.locked?(correct?"correct":"wrong"):""}" tabindex="0" draggable="${!answer.locked}" data-order-id="${id}"><span class="drag-mark">☰</span><span>${map[id].text}${answer.locked&&!correct?`<div class="position-note">Correct position: ${should}</div>`:answer.locked?`<div class="position-note" style="color:#15803d">+${(q.points/q.lines.length).toFixed(2)}</div>`:""}</span><span class="move-controls"><button class="move-btn" data-move="up" data-id="${id}" ${answer.locked||index===0?"disabled":""}>▲</button><button class="move-btn" data-move="down" data-id="${id}" ${answer.locked||index===answer.order.length-1?"disabled":""}>▼</button></span></div>`});html+=`</div>`;
 if(!answer.locked)html+=`<button class="check-btn" id="check-b">Check Order</button>`;if(answer.locked)html+=feedbackMarkup(answer.isCorrect,q.explanation);area.innerHTML=html;
 if(answer.locked)return;
 area.querySelectorAll("[data-order-id]").forEach(el=>{el.addEventListener("dragstart",()=>draggedId=el.dataset.orderId);el.addEventListener("dragover",e=>e.preventDefault());el.addEventListener("drop",e=>{e.preventDefault();const target=el.dataset.orderId;moveOrder(draggedId,target,q,answer)});el.addEventListener("keydown",e=>{const id=el.dataset.orderId,idx=answer.order.indexOf(id);if(e.key==="ArrowUp"&&idx>0){swapOrder(idx,idx-1,q,answer)}if(e.key==="ArrowDown"&&idx<answer.order.length-1){swapOrder(idx,idx+1,q,answer)}})});
 area.querySelectorAll("[data-move]").forEach(btn=>btn.addEventListener("click",()=>{const i=answer.order.indexOf(btn.dataset.id);swapOrder(i,btn.dataset.move==="up"?i-1:i+1,q,answer)}));
 document.getElementById("check-b").addEventListener("click",()=>{let score=0;answer.order.forEach((id,index)=>{if(id===q.correctOrder[index])score+=q.points/q.lines.length});setLocked(currentIndex,score,score===q.points);renderQuestion()});
}
function swapOrder(from,to,q,answer){if(to<0||to>=answer.order.length)return;[answer.order[from],answer.order[to]]=[answer.order[to],answer.order[from]];sound("click");renderTypeB(q,answer)}
function moveOrder(id,target,q,answer){const from=answer.order.indexOf(id),to=answer.order.indexOf(target);if(from<0||to<0)return;answer.order.splice(from,1);answer.order.splice(to,0,id);sound("click");renderTypeB(q,answer)}

function renderTypeC(q,answer){
 const area=document.getElementById("task-area");answer.matches||={};const displayOptions=q._displayOptions||=shuffle(q.functionOptions);let html=`<div>`;
 q.pairs.forEach((pair,index)=>{const val=answer.matches[pair.id]||"";const ok=val===pair.correctFunction;html+=`<div class="matching-row"><div class="match-sentence">${index+1}. ${pair.sentence}</div><div><select class="match-select ${answer.locked?(ok?"correct":"wrong"):""}" data-pair="${pair.id}" ${answer.locked?"disabled":""}><option value="">Select the purpose phrase…</option>${displayOptions.map(o=>`<option value="${o.replace(/"/g,"&quot;")}" ${val===o?"selected":""}>${o}</option>`).join("")}</select>${answer.locked&&!ok?`<div class="tile-note">Correct: ${pair.correctFunction}</div>`:""}</div></div>`});html+=`</div>`;
 if(!answer.locked)html+=`<button class="check-btn" id="check-c" ${Object.keys(answer.matches).length!==q.pairs.length?"disabled":""}>Check Matches</button>`;if(answer.locked)html+=feedbackMarkup(answer.isCorrect,q.explanation);area.innerHTML=html;
 if(answer.locked)return;area.querySelectorAll("[data-pair]").forEach(select=>select.addEventListener("change",()=>{answer.matches[select.dataset.pair]=select.value;if(!select.value)delete answer.matches[select.dataset.pair];sound("click");renderTypeC(q,answer)}));document.getElementById("check-c").addEventListener("click",()=>{let score=0;q.pairs.forEach(pair=>{if(answer.matches[pair.id]===pair.correctFunction)score+=q.points/q.pairs.length});setLocked(currentIndex,score,score===q.points);renderQuestion()});
}

function renderTypeD(q,answer){
 const area=document.getElementById("task-area"),order=getOrder(q,"_displayOrder",q.choices);let html=`<p class="task-text">${q.task}</p><div class="choice-list">`;
 order.forEach((choice,index)=>{const selected=answer.selected===choice,correct=answer.locked&&choice===q.correctAnswer,wrong=answer.locked&&selected&&!correct;html+=`<button class="choice ${selected&&!answer.locked?"selected":""} ${correct?"correct":wrong?"wrong":""}" data-choice="${encodeURIComponent(choice)}" ${answer.locked?"disabled":""}><strong>${index+1}.</strong> ${choice}</button>`});html+=`</div>`;if(answer.locked)html+=feedbackMarkup(answer.isCorrect,q.explanation);area.innerHTML=html;
 if(!answer.locked)area.querySelectorAll("[data-choice]").forEach(btn=>btn.addEventListener("click",()=>{answer.selected=decodeURIComponent(btn.dataset.choice);const ok=answer.selected===q.correctAnswer;setLocked(currentIndex,ok?q.points:0,ok);renderQuestion()}));
}

function renderTypeE(q,answer){
 const area=document.getElementById("task-area"),order=getOrder(q,"_displayOrder",q.choices);let html=`<div class="chat">`;
 q.dialogue.forEach(turn=>{const isMissing=turn.text==="...";let text=turn.text;if(isMissing&&answer.locked)text=answer.selected===q.correctAnswer?answer.selected:q.correctAnswer;html+=`<div class="bubble bubble-${turn.speaker.toLowerCase()} ${isMissing?"missing":""} ${isMissing&&answer.locked?"revealed":""}"><strong>${turn.speaker}:</strong> ${text}</div>`});html+=`</div><div class="choice-list">`;
 order.forEach((choice,index)=>{const selected=answer.selected===choice,correct=answer.locked&&choice===q.correctAnswer,wrong=answer.locked&&selected&&!correct;html+=`<button class="choice ${selected&&!answer.locked?"selected":""} ${correct?"correct":wrong?"wrong":""}" data-exchange="${encodeURIComponent(choice)}" ${answer.locked?"disabled":""}><strong>${index+1}.</strong> ${choice}</button>`});html+=`</div>`;
 if(!answer.locked)html+=`<button class="check-btn" id="check-e" ${!answer.selected?"disabled":""}>Check Answer</button>`;
 if(answer.locked)html+=`<div class="function-tag">Function: ${q.function}</div>${feedbackMarkup(answer.isCorrect,q.explanation)}`;area.innerHTML=html;
 if(answer.locked)return;area.querySelectorAll("[data-exchange]").forEach(btn=>btn.addEventListener("click",()=>{answer.selected=decodeURIComponent(btn.dataset.exchange);sound("click");renderTypeE(q,answer)}));document.getElementById("check-e").addEventListener("click",()=>{const ok=answer.selected===q.correctAnswer;setLocked(currentIndex,ok?q.points:0,ok);renderQuestion()});
}

function getRemark(score){if(score<10)return"Fail";if(score<12)return"Pass";if(score<14)return"Fairly Good";if(score<16)return"Good";if(score<18)return"Very Good";return"Excellent!"}
function showResults(){
 timer.pause();document.getElementById("quiz-view").classList.add("hidden");const result=document.getElementById("result-view");result.classList.remove("hidden");const score=totalScore(),correct=Object.values(state.answers).filter(a=>a.isCorrect).length,wrong=10-correct,accuracy=(correct/10*100).toFixed(0);state.attempts++;state.lastScore=score;state.bestScore=Math.max(state.bestScore,score);localStorage.setItem("purposeAttempts",state.attempts);localStorage.setItem("purposeLastScore",score);localStorage.setItem("purposeBestScore",state.bestScore);localStorage.setItem("purposeTime",timer.format());
 result.innerHTML=`<article class="result-panel"><div class="result-kicker">QUIZ / UNIT ${quizConfig.unit} / ${quizConfig.title} / ${quizConfig.lesson}</div><div class="score-badge">${score.toFixed(2)}<small style="font-size:15px">/20</small></div><div id="remark" class="remark">Checking…</div><section class="summary"><h2 style="margin-top:0;color:#1e3a5f">Performance Summary</h2><div class="summary-grid"><div class="summary-item">Final Score<b>${score.toFixed(2)} /20</b></div><div class="summary-item">Correct Answers<b>${correct}</b></div><div class="summary-item">Wrong Answers<b>${wrong}</b></div><div class="summary-item">Accuracy<b>${accuracy}%</b></div><div class="summary-item">Time Taken<b>${timer.format()}</b></div><div class="summary-item">Attempts<b>${state.attempts}</b></div><div class="summary-item">Best Score<b>${state.bestScore.toFixed(2)} /20</b></div></div><div class="breakdown"><h3>Question Breakdown</h3><ul style="list-style:none;padding:0;margin:0">${quizConfig.questions.map((q,i)=>`<li><span>${i+1}. ${q.category}</span><strong>${(state.scores[i]||0).toFixed(2)}/2</strong></li>`).join("")}</ul></div></section><div class="result-actions"><button class="result-btn" id="review-btn">Review My Answers</button><button class="result-btn alt" id="restart-btn">Restart Quiz</button><button class="result-btn alt" id="print-btn">Print Results</button><button class="result-btn alt" id="save-btn">Save Results</button></div></article>`;
 animateRemark(getRemark(score));if(score>=16&&quizConfig.showConfetti){sound("complete");confetti()}document.getElementById("review-btn").onclick=showReview;document.getElementById("restart-btn").onclick=restartQuiz;document.getElementById("print-btn").onclick=()=>window.print();document.getElementById("save-btn").onclick=saveReport;
}
function animateRemark(final){const labels=["Fail","Pass","Fairly Good","Good","Very Good","Excellent!"];let count=0;const el=document.getElementById("remark");const id=setInterval(()=>{el.textContent=labels[count%labels.length];count++;if(count===15){clearInterval(id);el.textContent=final}},190)}
function confetti(){const colors=["#2563eb","#16a34a","#f59e0b","#dc2626"];for(let i=0;i<70;i++){const el=document.createElement("i");el.className="confetti";el.style.left=Math.random()*100+"%";el.style.background=colors[i%colors.length];el.style.animationDelay=Math.random()*1.4+"s";document.body.appendChild(el);setTimeout(()=>el.remove(),5200)}}
function saveReport(){const score=totalScore();const report=`English2BAC Quizzes\nUnit ${quizConfig.unit}: ${quizConfig.title}\n${quizConfig.lesson}\n\nFinal Score: ${score.toFixed(2)} /20\nTime Taken: ${timer.format()}\n\n${quizConfig.questions.map((q,i)=>`${i+1}. ${q.category}: ${(state.scores[i]||0).toFixed(2)}/2`).join("\n")}`;const blob=new Blob([report],{type:"text/plain"}),link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="expressing-purpose-results.txt";link.click();URL.revokeObjectURL(link.href)}
function showReview(){document.getElementById("result-view").classList.add("hidden");const view=document.getElementById("review-view");view.classList.remove("hidden");view.innerHTML=quizConfig.questions.map((q,i)=>reviewCard(q,i)).join("")+`<div class="result-actions no-print"><button class="result-btn" id="back-results">Back to Results</button><button class="result-btn alt" id="restart-review">Restart Quiz</button></div>`;document.getElementById("back-results").onclick=()=>{view.classList.add("hidden");document.getElementById("result-view").classList.remove("hidden")};document.getElementById("restart-review").onclick=restartQuiz}
function reviewCard(q,index){const a=questionState(index);let rows="";if(q.type==="drag-classify")rows=q.tiles.map(t=>`<div class="review-line ${a.placements[t.id]===t.correctColumn?"review-ok":"review-no"}">${t.text} — Student: ${a.placements[t.id]||"Not placed"} | Correct: ${t.correctColumn}</div>`).join("");else if(q.type==="drag-order")rows=(a.order||[]).map((id,pos)=>{const line=q.lines.find(l=>l.id===id),correct=q.correctOrder.indexOf(id)+1;return `<div class="review-line ${correct===pos+1?"review-ok":"review-no"}">${line.text} — Student position: ${pos+1} | Correct position: ${correct}</div>`}).join("");else if(q.type==="matching")rows=q.pairs.map(p=>`<div class="review-line ${a.matches[p.id]===p.correctFunction?"review-ok":"review-no"}">${p.sentence}<br>Student: ${a.matches[p.id]||"No answer"}<br>Correct: ${p.correctFunction}</div>`).join("");else if(q.type==="complete-exchange")rows=`<div class="review-line">A: ${q.dialogue[0].text}<br>B: ${a.selected||"No answer"}<br><strong>Correct response:</strong> ${q.correctAnswer}<br><span class="function-tag">Function: ${q.function}</span></div>`;else rows=`<div class="review-line">Student Answer: <strong>${a.selected||"No answer"}</strong><br>Correct Answer: <strong>${q.correctAnswer}</strong></div>`;return `<article class="review-card"><h2>${index+1}. ${q.category} <span style="float:right">${(state.scores[index]||0).toFixed(2)}/2</span></h2>${rows}<div class="feedback">${q.explanation}</div></article>`}
function restartQuiz(){quizConfig.questions.forEach(q=>{delete q._displayOrder;delete q._displayOptions});state.answers={};state.scores={};currentIndex=0;selectedTileId=null;draggedId=null;timer.reset();document.getElementById("result-view").classList.add("hidden");document.getElementById("review-view").classList.add("hidden");document.getElementById("quiz-view").classList.remove("hidden");timer.start();renderQuestion()}
document.getElementById("previous-btn").addEventListener("click",()=>{if(currentIndex>0){currentIndex--;renderQuestion()}});
document.getElementById("next-btn").addEventListener("click",()=>{if(!questionState(currentIndex).locked)return;if(currentIndex===quizConfig.questions.length-1)showResults();else{currentIndex++;renderQuestion()}});
document.addEventListener("keydown",e=>{const q=quizConfig.questions[currentIndex],a=questionState(currentIndex);if(a.locked)return;if(q.type==="single-choice"&&/^[1-4]$/.test(e.key)){const choices=getOrder(q,"_displayOrder",q.choices);const choice=choices[Number(e.key)-1];if(choice){a.selected=choice;const ok=choice===q.correctAnswer;setLocked(currentIndex,ok?q.points:0,ok);renderQuestion()}}if(q.type==="complete-exchange"){if(/^[1-4]$/.test(e.key)){const choice=getOrder(q,"_displayOrder",q.choices)[Number(e.key)-1];if(choice){a.selected=choice;renderTypeE(q,a)}}if(e.key==="Enter"&&a.selected){const ok=a.selected===q.correctAnswer;setLocked(currentIndex,ok?q.points:0,ok);renderQuestion()}}});
timer.start();renderQuestion();
</script>
 
</body></html>
