  <style>

/* Result page */

.score-circle .score-num { font-size: 32px; font-weight: 800; }

/* Review */

}

 <body class="w-full">
  <div id="app" class="w-full max-w-4xl mx-auto min-h-screen flex flex-col">
   <!-- Header -->
   <div class="quiz-header">
    <img src="teacher.png" alt="Teacher Soufiane" class="header-teacher-img">
    <div class="header-center">
     <h1 class=""></h1>
     <h2 class=""></h2>
     <h3 class=""></h3>
    </div><img src="logo.png" alt="Level-UP 2BAC" class="header-logo-img">
   </div><!-- Progress bar -->
   <div class="progress-bar-container">
    <div id="progressBar" class="progress-bar-fill" style="width:0%"></div>

   <div id="quizContent"></div><!-- Bottom nav -->
   <div id="bottomNav" class="bottom-nav">
    <button class="nav-btn" id="prevBtn" onclick="goToPrev()" disabled="">◀ Previous</button> <span id="qCounter" style="font-weight:600;font-size:14px;">1 / 20</span> <button class="nav-btn" id="nextBtn" onclick="goToNext()" disabled="">Next ▶</button>
   </div><!-- Stats bar -->
   <div class="stats-bar" id="statsBar">
    <span>✅ Correct: <strong id="statCorrect">0</strong></span> <span>❌ Wrong: <strong id="statWrong">0</strong></span> <span>Score: <strong id="statScore">0.00</strong>/20</span> <span>Remaining: <strong id="statRemaining">20</strong></span> <span>⏱ <strong id="timerDisplay">00:00</strong></span>
   </div>

  <script>
// ============ CONFIGURATION ============
const quizConfig = {
unit: "UNIT 3", title: "EDUCATION", lesson: "VOCABULARY - QUIZ 1",
teacherName: "Teacher Soufiane",
randomizeQuestions: false, randomizeChoices: true,
timerEnabled: true, timerMode: "countup", countdownSeconds: 600,
showConfetti: true, enableSounds: true,
questions: [
{type:"single-choice",category:"Choose the word that matches the definition",question:"CHOOSE THE TYPE OF EDUCATION THAT BEST MATCHES THE DEFINITION.",task:"Organized learning that takes place outside traditional schools, like workshops or online courses.",choices:["non-formal education","basic education","special education","vocational education"],correctAnswer:"non-formal education",explanation:"Non-formal education refers to structured learning that happens outside the traditional school system, such as workshops or online courses.",points:1},
{type:"single-choice",category:"Choose the word that matches the definition",question:"CHOOSE THE WORD THAT MATCHES THE DEFINITION.",task:"Foundational learning, including reading, writing, and arithmetic, often at primary school level.",choices:["basic education","non-formal education","special education","vocational education"],correctAnswer:"basic education",explanation:"Basic education covers the foundational skills like reading, writing, and arithmetic taught at the primary level.",points:1},
{type:"single-choice",category:"Choose the word that matches the definition",question:"CHOOSE THE WORD THAT MATCHES THE DEFINITION.",task:"Education tailored for students with special needs or disabilities.",choices:["special education","basic education","non-formal education","vocational education"],correctAnswer:"special education",explanation:"Special education is designed specifically for students with special needs or disabilities.",points:1},
{type:"single-choice",category:"Choose the word that matches the definition",question:"CHOOSE THE WORD THAT MATCHES THE DEFINITION.",task:"Training focused on specific jobs or skills, like carpentry or computer programming.",choices:["vocational education","special education","basic education","non-formal education"],correctAnswer:"vocational education",explanation:"Vocational education trains students for specific trades or job skills, such as carpentry or programming.",points:1},
{type:"single-choice",category:"Put the word in brackets in its correct form",question:"PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.",task:"We need technical ______ to operate the new machines. (assist)",choices:["assistance","assist","assistant","assisting"],correctAnswer:"assistance",explanation:"We need a noun after 'technical', so the verb 'assist' becomes 'assistance'.",points:1},
{type:"single-choice",category:"Put the word in brackets in its correct form",question:"PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.",task:"______ education helps students integrate into the job market easily. (vocation)",choices:["Vocational","Vocation","Vocationally","Vocationalize"],correctAnswer:"Vocational",explanation:"We need an adjective before 'education', so 'vocation' becomes 'vocational'.",points:1},
{type:"single-choice",category:"Put the word in brackets in its correct form",question:"PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.",task:"Renewable energy contributes to the ______ of social services. (improve)",choices:["improvement","improve","improved","improving"],correctAnswer:"improvement",explanation:"We need a noun after 'the', so the verb 'improve' becomes 'improvement'.",points:1},
{type:"single-choice",category:"Put the word in brackets in its correct form",question:"PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.",task:"Corporal ______ is forbidden in our schools. (punish)",choices:["punishment","punish","punishable","punishing"],correctAnswer:"punishment",explanation:"We need a noun after 'corporal', so the verb 'punish' becomes 'punishment'.",points:1},
{type:"single-choice",category:"Fill in the gap with the appropriate word from the list",question:"FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.",task:"The government offers a ______ to help talented students from low-income families continue their studies.",choices:["scholarship","dropouts","e-learning","special needs"],correctAnswer:"scholarship",explanation:"A scholarship is financial support given to help talented students continue their education.",points:1},
{type:"single-choice",category:"Fill in the gap with the appropriate word from the list",question:"FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.",task:"______ has become a popular option for students who want to study at their own pace.",choices:["E-learning","Scholarship","Dropouts","Special needs"],correctAnswer:"E-learning",explanation:"E-learning refers to studying online, which allows students to learn at their own pace.",points:1},
{type:"single-choice",category:"Fill in the gap with the appropriate word from the list",question:"FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.",task:"Unfortunately, the number of school ______ has increased due to financial and social problems.",choices:["dropouts","scholarship","e-learning","special needs"],correctAnswer:"dropouts",explanation:"Dropouts refers to students who leave school before completing their studies.",points:1},
{type:"single-choice",category:"Fill in the gap with the appropriate word from the list",question:"FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.",task:"Many students with ______ require extra support to succeed in school.",choices:["special needs","scholarship","dropouts","e-learning"],correctAnswer:"special needs",explanation:"Students with special needs require additional support to succeed academically.",points:1},
{type:"single-choice",category:"Choose the word that completes the collocation",question:"CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.",task:"A lot of students resort to private ______ in the evening, especially in math and physics.",choices:["lessons","opportunities","discrimination","illiteracy"],correctAnswer:"lessons",explanation:"'Private lessons' is the correct natural collocation meaning individual tutoring sessions.",points:1},
{type:"single-choice",category:"Choose the word that completes the collocation",question:"CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.",task:"We are working on a program to provide equal ______ for girls and boys to access primary education.",choices:["opportunities","lessons","discrimination","illiteracy"],correctAnswer:"opportunities",explanation:"'Equal opportunities' is the correct natural collocation meaning fair chances for everyone.",points:1},
{type:"single-choice",category:"Choose the word that completes the collocation",question:"CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.",task:"One way to eradicate gender ______ is to encourage girls to have access to school and work.",choices:["discrimination","opportunities","lessons","illiteracy"],correctAnswer:"discrimination",explanation:"'Gender discrimination' is the correct natural collocation meaning unfair treatment based on gender.",points:1},
{type:"single-choice",category:"Choose the word that completes the collocation",question:"CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.",task:"The problem of adult ______ can be solved through organizing non-formal evening classes.",choices:["illiteracy","discrimination","opportunities","lessons"],correctAnswer:"illiteracy",explanation:"'Adult illiteracy' is the correct natural collocation meaning the inability of adults to read and write.",points:1},
{type:"three-synonyms",category:"Three Synonyms Challenge",question:"SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.",targetWord:"LIFELONG",options:["lasting","enduring","permanent","temporary"],correctSynonyms:["lasting","enduring","permanent"],antonym:"temporary",explanation:"'Lasting', 'enduring', and 'permanent' all describe something that continues for a very long time, like 'lifelong'. 'Temporary' means the opposite — lasting only for a short time.",points:1},
{type:"three-synonyms",category:"Three Synonyms Challenge",question:"SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.",targetWord:"UNIVERSAL",options:["worldwide","global","international","national"],correctSynonyms:["worldwide","global","international"],antonym:"national",explanation:"'Worldwide', 'global', and 'international' all describe something that applies everywhere, like 'universal'. 'National' means the opposite — limited to one country.",points:1},
{type:"three-synonyms",category:"Three Synonyms Challenge",question:"SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.",targetWord:"FORMAL",options:["official","structured","conventional","informal"],correctSynonyms:["official","structured","conventional"],antonym:"informal",explanation:"'Official', 'structured', and 'conventional' all describe something following set rules or procedures, like 'formal'. 'Informal' means the opposite — casual and unstructured.",points:1},
{type:"three-synonyms",category:"Three Synonyms Challenge",question:"SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.",targetWord:"KNOWLEDGEABLE",options:["informed","learned","educated","ignorant"],correctSynonyms:["informed","learned","educated"],antonym:"ignorant",explanation:"'Informed', 'learned', and 'educated' all describe someone with a lot of knowledge, like 'knowledgeable'. 'Ignorant' means the opposite — lacking knowledge or awareness.",points:1}
]
};

// ============ STATE ============
let currentQ = 0;
let answers = new Array(20).fill(null); // stores {selected, correct, locked}
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let timerSeconds = 0;
let timerInterval = null;
let quizFinished = false;
let synonymSelections = {}; // index -> Set of selected options

// Shuffle helper
function shuffle(arr) { let a = [...arr]; for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// Prepare questions (shuffle choices if enabled)
let questions = quizConfig.questions.map((q,i) => {
  let qCopy = {...q};
  if(quizConfig.randomizeChoices) {
    if(q.type==='single-choice') qCopy.choices = shuffle(q.choices);
    else qCopy.options = shuffle(q.options);
  }
  return qCopy;
});

// ============ TIMER ============
function startTimer() {
  if(timerInterval) return;
  timerInterval = setInterval(() => {
    timerSeconds++;
    document.getElementById('timerDisplay').textContent = formatTime(timerSeconds);
  }, 1000);
}
function pauseTimer() { clearInterval(timerInterval); timerInterval = null; }
function resetTimer() { pauseTimer(); timerSeconds = 0; document.getElementById('timerDisplay').textContent = '00:00'; }
function formatTime(s) { return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }

// ============ SOUNDS ============
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if(!quizConfig.enableSounds) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  gain.gain.value = 0.15;
  if(type==='correct'){osc.frequency.value=600;osc.type='sine';gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);osc.start();osc.stop(audioCtx.currentTime+0.3);}
  else if(type==='wrong'){osc.frequency.value=200;osc.type='square';gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);osc.start();osc.stop(audioCtx.currentTime+0.3);}
  else if(type==='click'){osc.frequency.value=800;osc.type='sine';gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1);osc.start();osc.stop(audioCtx.currentTime+0.1);}
  else if(type==='celebrate'){osc.frequency.value=880;osc.type='sine';gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.6);osc.start();osc.stop(audioCtx.currentTime+0.6);}
}

// ============ RENDER ============
function renderQuestion() {
  const q = questions[currentQ];
  const content = document.getElementById('quizContent');
  let html = ``;
  html += `<div class="question-box">${q.question}</div>`;

  if(q.type === 'single-choice') {
    html += `<div class="task-area">${q.task}</div>`;
    html += `<div class="choices-area">`;
    q.choices.forEach((c,i) => {
      let cls = 'choice-btn';
      if(answers[currentQ]?.locked) {
        cls += ' locked';
        if(c === q.correctAnswer) cls += ' correct';
        else if(c === answers[currentQ].selected && c !== q.correctAnswer) cls += ' wrong';
      }
      html += `<button class="${cls}" onclick="selectChoice(${i})" ${answers[currentQ]?.locked?'disabled':''}>${c}</button>`;
    });
    html += `</div>`;
  } else {
    // Three synonyms
    html += `<div class="task-area"><div class="target-word">${q.targetWord}</div><p style="font-size:13px;color:#718096;margin-top:4px;">Select exactly 3 synonyms</p></div>`;
    const sel = synonymSelections[currentQ] || new Set();
    html += `<div class="choices-area">`;
    q.options.forEach((o,i) => {
      let cls = 'choice-btn';
      if(answers[currentQ]?.locked) {
        cls += ' locked';
        if(q.correctSynonyms.includes(o)) cls += ' correct';
        else if(sel.has(o) && !q.correctSynonyms.includes(o)) cls += ' wrong';
        else if(o === q.antonym && !sel.has(o)) cls += ' gray-out';
      } else if(sel.has(o)) cls += ' selected-synonym';
      html += `<button class="${cls}" onclick="selectSynonym(${i})" ${answers[currentQ]?.locked?'disabled':''}>${o}${answers[currentQ]?.locked && o===q.antonym?' <span class="antonym-tag">antonym</span>':''}</button>`;
    });
    html += `</div>`;
  }

  // Show feedback if answered
  if(answers[currentQ]?.locked) {
    const isCorrect = answers[currentQ].correct;
    const fbMsgs = isCorrect ? ['Excellent!','Great Job!','Perfect!','Keep Going!'] : ['Almost!','Review this rule.','Keep learning!','You\'ll get the next one!'];
    html += `<div class="feedback-msg ${isCorrect?'correct-fb':'wrong-fb'}">${fbMsgs[Math.floor(Math.random()*fbMsgs.length)]}</div>`;
    html += `<div class="explanation-box">💡 ${q.explanation}</div>`;
  }

  content.innerHTML = html;
  updateUI();
}

function selectChoice(i) {
  if(answers[currentQ]?.locked) return;
  const q = questions[currentQ];
  const selected = q.choices[i];
  const correct = selected === q.correctAnswer;
  answers[currentQ] = { selected, correct, locked: true };
  if(correct){ score++; correctCount++; playSound('correct'); }
  else { wrongCount++; playSound('wrong'); }
  renderQuestion();
}

function selectSynonym(i) {
  if(answers[currentQ]?.locked) return;
  const q = questions[currentQ];
  const opt = q.options[i];
  if(!synonymSelections[currentQ]) synonymSelections[currentQ] = new Set();
  const sel = synonymSelections[currentQ];

  if(sel.has(opt)) { sel.delete(opt); playSound('click'); renderQuestion(); return; }
  if(sel.size >= 3) return;
  sel.add(opt); playSound('click');

  if(sel.size === 3) {
    // Evaluate after brief delay
    renderQuestion();
    setTimeout(() => {
      if(synonymSelections[currentQ].size !== 3) return; // user may have deselected
      const correct = q.correctSynonyms.every(s => sel.has(s)) && sel.size === 3;
      answers[currentQ] = { selected: [...sel], correct, locked: true };
      if(correct){ score++; correctCount++; playSound('correct'); }
      else { wrongCount++; playSound('wrong'); }
      renderQuestion();
    }, 500);
  } else { renderQuestion(); }
}

function updateUI() {
  document.getElementById('qCounter').textContent = `${currentQ+1} / 20`;
  document.getElementById('statCorrect').textContent = correctCount;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statScore').textContent = score.toFixed(2);
  document.getElementById('statRemaining').textContent = 20 - (correctCount+wrongCount);
  document.getElementById('progressBar').style.width = ((correctCount+wrongCount)/20*100)+'%';
  document.getElementById('prevBtn').disabled = currentQ === 0;
  document.getElementById('nextBtn').disabled = !answers[currentQ]?.locked;
}

function goToNext() {
  if(currentQ < 19) { currentQ++; renderQuestion(); }
  else { finishQuiz(); }
}
function goToPrev() { if(currentQ > 0){ currentQ--; renderQuestion(); } }

// ============ RESULT PAGE ============
function finishQuiz() {
  quizFinished = true; pauseTimer();
  playSound('celebrate');
  saveToStorage();

  const pct = (score/20*100).toFixed(1);
  let remark = score<10?'Fail':score<12?'Pass':score<14?'Fairly Good':score<16?'Good':score<18?'Very Good':'Excellent!';
  const remarks = ['Fail','Pass','Fairly Good','Good','Very Good','Excellent!'];

  // Category breakdown
  const cats = ['Choose the word that matches the definition','Put the word in brackets in its correct form','Fill in the gap with the appropriate word from the list','Choose the word that completes the collocation','Three Synonyms Challenge'];
  const catLabels = ['Definitions','Word Forms','Word Bank','Collocations','Synonyms Challenge'];
  let breakdownHTML = '';
  cats.forEach((c,ci) => {
    const start = ci*4; let catScore=0;
    for(let j=start;j<start+4;j++) if(answers[j]?.correct) catScore++;
    breakdownHTML += `<div><span>${catLabels[ci]}</span><span>${catScore}/4</span></div>`;
  });

  document.getElementById('bottomNav').style.display='none';
  document.getElementById('quizContent').innerHTML = `
    <div class="result-page">
      <h2 style="color:#1a365d;font-weight:800;">Quiz Complete!</h2>
      <p style="color:#4a5568;">${quizConfig.unit} • ${quizConfig.title} • ${quizConfig.lesson}</p>
      <div class="score-circle"><span class="score-num">${score.toFixed(2)}</span><span class="score-den">/ 20</span></div>
      <div class="remark-slot" id="remarkSlot">${remark}</div>
      <div class="category-breakdown">${breakdownHTML}</div>
      <div style="margin:16px 0;font-size:14px;color:#4a5568;">
        <p>✅ Correct: ${correctCount} | ❌ Wrong: ${wrongCount}</p>
        <p>Accuracy: ${pct}% | Time: ${formatTime(timerSeconds)}</p>
        <p>Attempts: ${getAttempts()}</p>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;">
        <button class="nav-btn" onclick="showReview()">📋 Review My Answers</button>
        <button class="nav-btn" onclick="restartQuiz()">🔄 Restart Quiz</button>
        <button class="nav-btn" onclick="window.print()">🖨 Print Results</button>
      </div>
    </div>`;

  // Remark animation
  animateRemark(remark, remarks);
  if(quizConfig.showConfetti && score >= 16) showConfetti();
}

function animateRemark(final, remarks) {
  const el = document.getElementById('remarkSlot');
  let count = 0; const total = 30;
  const interval = setInterval(() => {
    el.textContent = remarks[Math.floor(Math.random()*remarks.length)];
    count++;
    if(count >= total){ clearInterval(interval); el.textContent = final; }
  }, 100);
}

function showConfetti() {
  const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd'];
  for(let i=0;i<60;i++){
    const c = document.createElement('div');
    c.className='confetti-piece';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=Math.random()*2+'s';
    c.style.borderRadius=Math.random()>0.5?'50%':'0';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

// ============ REVIEW MODE ============
function showReview() {
  let html = `<div class="review-container"><h2 style="text-align:center;color:#1a365d;font-weight:700;">Review Answers</h2>`;
  html += `<div class="navigator">`;
  for(let i=0;i<20;i++){
    const cls = answers[i]?.correct?'nav-answered':'nav-unanswered';
    html += `<button class="${cls}" onclick="currentQ=${i};renderQuestion();document.getElementById('bottomNav').style.display='flex';">${i+1}</button>`;
  }
  html += `</div>`;

  questions.forEach((q,i) => {
    html += `<div class="review-card"><strong>Q${i+1}.</strong> <em>${q.category}</em><br>`;
    if(q.type==='single-choice'){
      html += `<p>${q.task}</p>`;
      html += `<p>Your answer: <span style="color:${answers[i]?.correct?'#38a169':'#e53e3e'}">${answers[i]?.selected||'No answer'}</span></p>`;
      html += `<p>Correct: <span style="color:#38a169">${q.correctAnswer}</span></p>`;
    } else {
      html += `<p>Target: <strong>${q.targetWord}</strong></p>`;
      html += `<p>Your picks: ${(answers[i]?.selected||[]).join(', ')||'None'}</p>`;
      html += `<p>Correct synonyms: <span style="color:#38a169">${q.correctSynonyms.join(', ')}</span></p>`;
      html += `<p>Antonym: <span style="color:#e53e3e">${q.antonym}</span></p>`;
    }
    html += `<p style="font-size:13px;color:#744210;background:#fffbeb;padding:8px;border-radius:6px;">💡 ${q.explanation}</p></div>`;
  });
  html += `<div style="text-align:center;margin:16px;"><button class="nav-btn" onclick="finishQuiz()">Back to Results</button></div></div>`;
  document.getElementById('quizContent').innerHTML = html;
}

// ============ STORAGE ============
function saveToStorage() {
  const attempts = (parseInt(localStorage.getItem('quiz_attempts'))||0)+1;
  localStorage.setItem('quiz_attempts', attempts);
  localStorage.setItem('quiz_last_score', score.toFixed(2));
  localStorage.setItem('quiz_time', formatTime(timerSeconds));
  const best = parseFloat(localStorage.getItem('quiz_best_score'))||0;
  if(score > best) localStorage.setItem('quiz_best_score', score.toFixed(2));
}
function getAttempts(){ return parseInt(localStorage.getItem('quiz_attempts'))||1; }

// ============ RESTART ============
function restartQuiz() {
  currentQ=0; answers=new Array(20).fill(null); score=0; correctCount=0; wrongCount=0; synonymSelections={};
  quizFinished=false; resetTimer();
  if(quizConfig.randomizeChoices){
    questions = quizConfig.questions.map(q=>{let c={...q};if(q.type==='single-choice')c.choices=shuffle(q.choices);else c.options=shuffle(q.options);return c;});
  }
  document.getElementById('bottomNav').style.display='flex';
  startTimer(); renderQuestion();
}

// ============ KEYBOARD ============
document.addEventListener('keydown', e => {
  if(quizFinished) return;
  const q = questions[currentQ];
  if(e.key>='1'&&e.key<='4'){
    const i=parseInt(e.key)-1;
    if(q.type==='single-choice') selectChoice(i);
    else selectSynonym(i);
  }
  if(e.key==='ArrowRight'||e.key==='Enter') { if(!document.getElementById('nextBtn').disabled) goToNext(); }
  if(e.key==='ArrowLeft') goToPrev();
});

// ============ INIT ============
startTimer();
renderQuestion();
</script>
 
</body></html>
