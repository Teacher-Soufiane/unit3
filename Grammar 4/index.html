<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3-Tense Mastery Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&amp;family=Poppins:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --dark-blue: #1e3a5f;
      --blue: #2563eb;
      --light-blue: #eaf4ff;
      --green: #16803c;
      --green-soft: #dcfce7;
      --red: #c53030;
      --red-soft: #fee2e2;
      --gray: #64748b;
      --line: #dbe5f0;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f2f6fa;
      color: #1e293b;
    }

    .quiz-container {
      width: 100%;
      max-width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      box-sizing: border-box;
      padding: 16px;
    }

    .quiz-card {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      box-sizing: border-box;
      background: #ffffff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(30, 58, 95, 0.13);
    }

    .quiz-header {
      background-color: #eaf4ff;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 14px 24px;
      border-bottom: 1px solid #cfe2f8;
    }

    .header-teacher-img,
    .header-logo-img {
      height: 64px;
      width: auto;
      max-width: none;
      object-fit: contain;
      display: block;
    }

    .header-title {
      text-align: center;
      line-height: 1.2;
      min-width: 0;
    }

    .title-line1 {
      font-family: 'Poppins', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #1e3a5f;
    }

    .title-line2 {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 400;
      color: #2563eb;
    }

    .title-line3 {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: #64748b;
    }

    .info-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      padding: 12px 24px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      color: var(--dark-blue);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .info-center { text-align: center; }
    .info-right { text-align: right; }

    .quiz-body { padding: 26px; }

    .instruction-box {
      background: var(--dark-blue);
      color: #ffffff;
      font-size: 20px;
      line-height: 1.35;
      font-weight: 800;
      text-align: center;
      padding: 18px 22px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .task-box {
      border: 1px solid #d5e2ef;
      border-left: 6px solid var(--blue);
      border-radius: 12px;
      background: #f8fbff;
      padding: 20px;
      font-size: 17px;
      line-height: 1.7;
      min-height: 104px;
      display: flex;
      align-items: center;
    }

    .choices-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .choice-tile {
      width: 100%;
      border: 2px solid #d5e2ef;
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      color: #20334a;
      text-align: left;
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 13px;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.45;
    }

    .choice-tile:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--blue);
      background: #f5f9ff;
    }

    .choice-tile:focus-visible,
    .nav-button:focus-visible,
    .hint-button:focus-visible,
    .action-button:focus-visible {
      outline: 3px solid #f8c95b;
      outline-offset: 3px;
    }

    .choice-tile:disabled { cursor: default; }
    .choice-letter {
      width: 31px;
      height: 31px;
      flex: 0 0 31px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #eaf4ff;
      color: var(--dark-blue);
      font-weight: 800;
    }

    .choice-tile.correct {
      background: var(--green-soft);
      border-color: var(--green);
      color: #135d2f;
    }

    .choice-tile.correct .choice-letter {
      background: var(--green);
      color: #ffffff;
    }

    .choice-tile.incorrect {
      background: var(--red-soft);
      border-color: var(--red);
      color: #8f2525;
    }

    .choice-tile.incorrect .choice-letter {
      background: var(--red);
      color: #ffffff;
    }

    .below-choices {
      min-height: 88px;
      margin-top: 16px;
    }

    .hint-button,
    .nav-button,
    .action-button {
      border: 0;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .hint-button:hover,
    .nav-button:hover:not(:disabled),
    .action-button:hover { transform: translateY(-1px); filter: brightness(0.98); }

    .hint-button {
      background: #fff7dd;
      color: #805b00;
      border: 1px solid #efd47a;
      padding: 9px 14px;
      border-radius: 9px;
      font-size: 14px;
    }

    .hint-text {
      margin: 10px 0 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fffaf0;
      border-left: 4px solid #eab308;
      color: #6b5600;
      line-height: 1.55;
      font-size: 14px;
    }

    .feedback {
      margin: 14px 0 0;
      padding: 13px 15px;
      border-radius: 10px;
      font-weight: 800;
    }

    .feedback.good { background: var(--green-soft); color: #176237; }
    .feedback.bad { background: var(--red-soft); color: #992b2b; }

    .explanation {
      margin: 10px 0 0;
      padding: 14px 15px;
      border-radius: 10px;
      background: #f4f8fc;
      border: 1px solid #dbe5f0;
      color: #41546c;
      font-size: 14px;
      line-height: 1.6;
    }

    .navigation-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 14px;
      margin-top: 12px;
    }

    .nav-button {
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      background: var(--dark-blue);
      color: #ffffff;
    }

    .nav-button.next { justify-self: end; background: var(--blue); }
    .nav-button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .counter {
      color: var(--dark-blue);
      font-weight: 800;
      font-size: 15px;
      white-space: nowrap;
    }

    .stats-row {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: 16px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      color: #43566f;
      font-size: 14px;
      font-weight: 600;
    }

    .stats-row strong { color: var(--dark-blue); }

    .result-page { padding: 30px 26px; }
    .result-page[hidden], #quiz-screen[hidden], #review-screen[hidden] { display: none; }

    .result-heading { text-align: center; color: var(--dark-blue); }
    .result-meta { color: var(--gray); font-size: 14px; margin-top: 5px; }

    .score-badge {
      margin: 24px auto 18px;
      width: 190px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--dark-blue);
      color: #ffffff;
      border: 10px solid #cfe2f8;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 12px 26px rgba(30, 58, 95, 0.22);
    }

    .remark-slot {
      text-align: center;
      font-size: 28px;
      color: var(--blue);
      font-weight: 800;
      min-height: 43px;
    }

    .remark-description {
      max-width: 760px;
      margin: 8px auto 25px;
      text-align: center;
      line-height: 1.65;
      color: #52657d;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 24px 0;
    }

    .summary-item {
      background: #f7faff;
      border: 1px solid #dce8f4;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .summary-label { color: var(--gray); font-size: 12px; font-weight: 700; }
    .summary-value { color: var(--dark-blue); font-weight: 800; margin-top: 5px; font-size: 17px; }

    .breakdown {
      border: 1px solid #dbe5f0;
      border-radius: 13px;
      overflow: hidden;
      margin-top: 18px;
    }

    .breakdown h2 {
      padding: 15px 18px;
      margin: 0;
      background: #f4f8fc;
      color: var(--dark-blue);
      font-size: 17px;
    }

    .breakdown-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 13px 18px;
      border-top: 1px solid #e5edf5;
      font-size: 14px;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 26px;
    }

    .action-button {
      padding: 12px 17px;
      border-radius: 10px;
      background: var(--dark-blue);
      color: #ffffff;
    }

    .action-button.secondary { background: #eaf4ff; color: var(--dark-blue); border: 1px solid #bcd9f5; }

    .review-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }

    .review-heading { margin: 0; color: var(--dark-blue); }
    .review-level { margin-top: 28px; color: var(--dark-blue); font-size: 19px; }
    .review-card {
      margin-top: 12px;
      border: 1px solid #dbe5f0;
      border-radius: 13px;
      padding: 18px;
      background: #ffffff;
    }

    .review-task { line-height: 1.55; font-weight: 600; }
    .review-answer { margin-top: 11px; padding: 10px 12px; border-radius: 8px; line-height: 1.45; }
    .review-answer.right { background: var(--green-soft); color: #176237; }
    .review-answer.wrong { background: var(--red-soft); color: #922d2d; }
    .review-explanation { margin-top: 11px; color: #53667f; line-height: 1.55; font-size: 14px; }

    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 50;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 16px;
      animation: fall 2800ms linear forwards;
    }

    @keyframes fall {
      from { transform: translateY(-30px) rotate(0deg); opacity: 1; }
      to { transform: translateY(calc(100 * min(var(--vh, 1vh), 1vh) + 50px)) rotate(720deg); opacity: 0; }
    }

    @media (min-width: 600px) {
      .header-teacher-img,
      .header-logo-img { height: 80px; }
    }

    @media (min-width: 1024px) {
      .header-teacher-img,
      .header-logo-img { height: 96px; }
    }

    @media (max-width: 640px) {
      .quiz-container { padding: 0; }
      .quiz-card { border-radius: 0; min-height: calc(100 * min(var(--vh, 1vh), 1vh)); }
      .header-teacher-img,
      .header-logo-img { height: 45px; }
      .quiz-header { padding: 8px 12px; gap: 8px; }
      .title-line1 { font-size: 16px; }
      .title-line2 { font-size: 12px; }
      .title-line3 { font-size: 10px; }
      .info-bar { padding: 10px 12px; gap: 8px; font-size: 9px; }
      .quiz-body, .result-page { padding: 18px 14px; }
      .instruction-box { font-size: 16px; padding: 15px 12px; }
      .task-box { font-size: 15px; padding: 15px; }
      .choices-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .choice-tile { min-height: 92px; padding: 11px; font-size: 13px; align-items: flex-start; }
      .choice-letter { width: 27px; height: 27px; flex-basis: 27px; }
      .navigation-row { gap: 8px; }
      .nav-button { padding: 11px 12px; font-size: 13px; }
      .stats-row { flex-wrap: wrap; gap: 8px 14px; font-size: 12px; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .score-badge { width: 160px; font-size: 24px; }
      .remark-slot { font-size: 23px; }
    }

    @media print {
      body { background: #ffffff; }
      .quiz-container { padding: 0; }
      .quiz-card { box-shadow: none; max-width: 100%; }
      .quiz-header { background: #eaf4ff !important; }
      .result-actions, .confetti-layer { display: none !important; }
    }
  </style>

 <body>

  <script>
    // Quiz configuration and fixed 8-level progression.
    const quizConfig = {
      unit: "3",
      title: "3-TENSE MASTERY CHALLENGE",
      lesson: "GRAMMAR QUIZ 4",
      teacherName: "Teacher Soufiane",
      teacherImage: "https://i.imgur.com/vvyZAnr.png",
      logo: "https://i.imgur.com/XPOYllA.png",
      randomizeQuestions: false,
      randomizeChoices: true,
      timerEnabled: true,
      timerMode: "countup",
      countdownSeconds: 600,
      showConfetti: true,
      enableSounds: true,
      questions: [
        {type:"single-choice",level:1,category:"Timeline Race",question:"WHICH EVENT HAPPENED FIRST?",task:"Look at the timeline: The train left the station. Sara arrived at the station after the train had already left. Which sentence correctly describes these two past events?",choices:["When Sara arrived, the train left.","When Sara arrived, the train had left.","When Sara arrived, the train has left.","When Sara arrived, the train was leaving."],correctAnswer:"When Sara arrived, the train had left.",explanation:"The train left FIRST, so that earlier action takes the Past Perfect Simple ('had left'); Sara's arrival, the later action, takes the Past Simple ('arrived').",hint:"Think about which of the two events happened first — the earlier one needs the Past Perfect.",points:1},
        {type:"single-choice",level:1,category:"Timeline Race",question:"WHICH EVENT HAPPENED FIRST?",task:"Look at the timeline: The movie finished. We got to the cinema after the movie had already finished. Which sentence correctly describes these two past events?",choices:["When we got to the cinema, the movie finished.","When we got to the cinema, the movie had finished.","When we got to the cinema, the movie has finished.","When we got to the cinema, the movie was finishing."],correctAnswer:"When we got to the cinema, the movie had finished.",explanation:"The movie finished FIRST, so that earlier action takes the Past Perfect Simple ('had finished'); getting to the cinema, the later action, takes the Past Simple ('got').",hint:"Think about which of the two events happened first.",points:1},
        {type:"single-choice",level:1,category:"Timeline Race",question:"WHICH EVENT HAPPENED FIRST?",task:"Look at the timeline: The shop closed. Yassine reached the shop after it had already closed. Which sentence correctly describes these two past events?",choices:["When Yassine reached the shop, it closed.","When Yassine reached the shop, it had closed.","When Yassine reached the shop, it has closed.","When Yassine reached the shop, it was closing."],correctAnswer:"When Yassine reached the shop, it had closed.",explanation:"The shop closed FIRST, so that earlier action takes the Past Perfect Simple ('had closed'); Yassine reaching the shop, the later action, takes the Past Simple ('reached').",hint:"Think about which of the two events happened first.",points:1},
        {type:"single-choice",level:2,category:"Tense Detective",question:"CHOOSE THE CORRECT TENSE.",task:"When I arrived home, my brother ______ dinner for two hours. (cook)",choices:["cooked","had cooked","had been cooking","cooks"],correctAnswer:"had been cooking",explanation:"'For two hours' signals an ongoing activity with duration before another past event (arriving home), so it needs the Past Perfect Continuous: 'had been cooking'.",hint:"Think about the duration clue 'for two hours' — which tense focuses on an ongoing activity before another past moment?",points:1},
        {type:"single-choice",level:2,category:"Tense Detective",question:"CHOOSE THE CORRECT TENSE.",task:"When Nora got back from school, her father ______ the fence. (paint)",choices:["painted","had painted","had been painting","paints"],correctAnswer:"had painted",explanation:"There is no duration clue here, only a completed result before Nora got back, so it needs the Past Perfect Simple: 'had painted'.",hint:"Think about whether this describes a finished result or an ongoing activity with duration.",points:1},
        {type:"single-choice",level:2,category:"Tense Detective",question:"CHOOSE THE CORRECT TENSE.",task:"By the time the bell rang, Sami ______ three pages of his essay. (write)",choices:["wrote","had written","had been writing","writes"],correctAnswer:"had written",explanation:"A specific completed quantity ('three pages') before a past reference point ('by the time') needs the Past Perfect Simple: 'had written'.",hint:"Think about the quantified result ('three pages') completed before the bell rang.",points:1},
        {type:"single-choice",level:3,category:"Signal Word Hunter",question:"FIND THE SIGNAL WORD.",task:"She had been working there for ten years before she retired yesterday, after starting the job last year and moving abroad two years ago. Which clue helps you identify the tense?",choices:["yesterday","for ten years","last year","ago"],correctAnswer:"for ten years",explanation:"'For ten years' is the duration clue showing the activity continued for a period before the later past event (retiring).",hint:"Look for the phrase that tells you how long the activity lasted before the other past event.",points:1},
        {type:"single-choice",level:3,category:"Signal Word Hunter",question:"FIND THE SIGNAL WORD.",task:"When we arrived, the movie had already started. Which expression signals the earlier completed action?",choices:["when","already","arrived","movie"],correctAnswer:"already",explanation:"'Already' signals that the action (the movie starting) was completed before the other past event (arriving).",hint:"Look for the word that tells you something had happened before the other past event, not just 'when' it happened.",points:1},
        {type:"single-choice",level:4,category:"Simple or Perfect?",question:"CHOOSE THE CORRECT TENSE.",task:"When the teacher arrived, the students ______ the test. (start)",choices:["started","had started","had been starting","start"],correctAnswer:"had started",explanation:"The students started the test BEFORE the teacher arrived, so the earlier action needs the Past Perfect Simple: 'had started'.",hint:"Think about which action happened first — starting the test, or the teacher arriving.",points:1},
        {type:"single-choice",level:4,category:"Simple or Perfect?",question:"CHOOSE THE CORRECT TENSE.",task:"After the manager ______ the report, he went home. (submit)",choices:["submitted","had submitted","had been submitting","submits"],correctAnswer:"had submitted",explanation:"Submitting the report happened BEFORE going home, so the earlier action needs the Past Perfect Simple: 'had submitted'.",hint:"Think about which action happened first — submitting the report, or going home.",points:1},
        {type:"single-choice",level:4,category:"Simple or Perfect?",question:"CHOOSE THE CORRECT TENSE.",task:"The children ______ breakfast before they left for school. (eat)",choices:["ate","had eaten","had been eating","eat"],correctAnswer:"had eaten",explanation:"Eating breakfast happened BEFORE leaving for school, so the earlier action needs the Past Perfect Simple: 'had eaten'.",hint:"Think about which action happened first — eating breakfast, or leaving for school.",points:1},
        {type:"single-choice",level:5,category:"Perfect or Continuous?",question:"CHOOSE THE CORRECT TENSE.",task:"The pavement was muddy because it ______ all night. (rain)",choices:["rained","had rained","had been raining","rains"],correctAnswer:"had been raining",explanation:"The focus is on the continuing activity (raining, all night) that caused the result, so it needs the Past Perfect Continuous: 'had been raining'.",hint:"Think about whether the focus is on a finished result or on an ongoing activity and its duration.",points:1},
        {type:"single-choice",level:5,category:"Perfect or Continuous?",question:"CHOOSE THE CORRECT TENSE.",task:"She felt dizzy because she ______ on the phone for so long. (talk)",choices:["talked","had talked","had been talking","talks"],correctAnswer:"had been talking",explanation:"'For so long' emphasizes duration/activity, not just a finished result, so it needs the Past Perfect Continuous: 'had been talking'.",hint:"Think about the duration clue 'for so long'.",points:1},
        {type:"single-choice",level:5,category:"Perfect or Continuous?",question:"CHOOSE THE CORRECT TENSE.",task:"The team was confident because they ______ hard for weeks before the final match. (practice)",choices:["practiced","had practiced","had been practicing","practices"],correctAnswer:"had been practicing",explanation:"'For weeks' shows the ongoing activity and its duration before the match, so it needs the Past Perfect Continuous: 'had been practicing'.",hint:"Think about the duration clue 'for weeks'.",points:1},
        {type:"single-choice",level:6,category:"Three-Tense Battle",question:"CHOOSE THE CORRECT TENSE.",task:"When I got to school, the lesson ______. (end)",choices:["ended","had ended","had been ending","ends"],correctAnswer:"had ended",explanation:"The lesson ending happened BEFORE getting to school, with no duration clue, so it needs the Past Perfect Simple: 'had ended'.",hint:"Think about which action happened first, and whether there's a duration clue.",points:1},
        {type:"single-choice",level:6,category:"Three-Tense Battle",question:"CHOOSE THE CORRECT TENSE.",task:"I was tired because I ______ for three hours before I reached home. (walk)",choices:["walked","had walked","had been walking","walk"],correctAnswer:"had been walking",explanation:"'For three hours... before' shows the ongoing activity and its duration before another past event (reaching home), so it needs the Past Perfect Continuous: 'had been walking'.",hint:"Think about the duration clue 'for three hours'.",points:1},
        {type:"single-choice",level:6,category:"Three-Tense Battle",question:"CHOOSE THE CORRECT TENSE.",task:"I ______ my friend yesterday. (call)",choices:["called","had called","had been calling","call"],correctAnswer:"called",explanation:"This is a single completed past action with no earlier reference point, so it needs the simple Past Simple: 'called'.",hint:"Think about whether there is a second past event to compare this action to.",points:1},
        {type:"single-choice",level:7,category:"Sentence Transformation",question:"CHOOSE THE CORRECT SENTENCE.",task:"Jim started working there in 2018. He found another job in 2024. Choose the sentence that correctly combines these ideas.",choices:["Jim worked there since 2018 before he found another job.","Jim had worked there since 2018 before he found another job.","Jim had been working there since 2018 before he found another job.","Jim has been working there since 2018 before he found another job."],correctAnswer:"Jim had been working there since 2018 before he found another job.",explanation:"'Since 2018' shows an activity continuing up to the later past event (finding another job), so it needs the Past Perfect Continuous: 'had been working'.",hint:"Think about which option captures both the duration ('since 2018') and the later past event.",points:1},
        {type:"single-choice",level:7,category:"Sentence Transformation",question:"CHOOSE THE CORRECT SENTENCE.",task:"The boy studied for three hours before the exam. Which sentence emphasizes the continuing activity rather than just the finished fact?",choices:["The boy studied for three hours before the exam.","The boy had studied for three hours before the exam.","The boy had been studying for three hours before the exam.","The boy has studied for three hours before the exam."],correctAnswer:"The boy had been studying for three hours before the exam.",explanation:"The Past Perfect Continuous ('had been studying') is the form that specifically emphasizes the ongoing activity and its duration, not just the completed fact.",hint:"Think about which tense is specifically used to highlight an activity in progress, not just a finished action.",points:1},
        {type:"single-choice",level:8,category:"BAC Final Mission",question:"FINAL MISSION — COMPLETE THE STORY.",task:"Yesterday, Ali arrived at the library at 6 p.m. He noticed that the other students ______ there for several hours. They had already ______ two chapters before he arrived, so Ali joined them and ______ his notes for two hours.",choices:["had been sitting / read / reviewed","sat / had read / had been reviewing","had been sitting / had been reading / was reviewing","sat / had been reading / reviewed"],correctAnswer:"had been sitting / read / reviewed",explanation:"The other students' sitting is an earlier ongoing activity with duration ('for several hours') → Past Perfect Continuous: 'had been sitting'. Reading two chapters is an earlier completed, quantified result (paired with 'already') → Past Perfect Simple: 'read'. Ali's own action after joining is a single later completed action → Past Simple: 'reviewed'.",hint:"Think about which action was ongoing, which was an earlier finished result, and which happened after Ali joined them.",points:1}
      ]
    };

    const levelNames = {
      1: "Timeline Race",
      2: "Tense Detective",
      3: "Signal Word Hunter",
      4: "Simple or Perfect?",
      5: "Perfect or Continuous?",
      6: "Three-Tense Battle",
      7: "Sentence Transformation",
      8: "BAC Final Mission"
    };

    const correctFeedback = ["Excellent!", "Great Job!", "Perfect!", "Keep Going!"];
    const incorrectFeedback = ["Almost!", "Review this rule.", "Keep learning!", "You'll get the next one!"];

    let currentQuestionIndex = 0;
    let questionStates = [];
    let finalTime = 0;

    // Independent timer module.
    const quizTimer = (() => {
      let seconds = 0;
      let intervalId = null;

      function format(value) {
        const absoluteValue = Math.max(0, value);
        const minutes = Math.floor(absoluteValue / 60);
        const remainingSeconds = absoluteValue % 60;
        return `${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;
      }

      function updateDisplay() {
        document.getElementById("timer-stat").textContent = format(seconds);
      }

      function start() {
        if (!quizConfig.timerEnabled || intervalId) return;
        intervalId = setInterval(() => {
          if (quizConfig.timerMode === "countdown") {
            seconds -= 1;
            if (seconds <= 0) {
              seconds = 0;
              updateDisplay();
              pause();
              finishQuiz();
              return;
            }
          } else {
            seconds += 1;
          }
          updateDisplay();
        }, 1000);
      }

      function pause() {
        if (intervalId) clearInterval(intervalId);
        intervalId = null;
      }

      function reset() {
        pause();
        seconds = quizConfig.timerMode === "countdown" ? quizConfig.countdownSeconds : 0;
        updateDisplay();
      }

      function getTime() { return seconds; }

      return { start, pause, reset, format, getTime };
    })();

    function createInitialStates() {
      return quizConfig.questions.map(() => ({
        displayOrder: null,
        selectedAnswer: null,
        answered: false,
        hintVisible: false
      }));
    }

    function shuffledOrder(length) {
      const order = Array.from({ length }, (_, index) => index);
      for (let index = order.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [order[index], order[randomIndex]] = [order[randomIndex], order[index]];
      }
      return order;
    }

    function getFixedDisplayOrder(questionIndex) {
      const state = questionStates[questionIndex];
      if (!state.displayOrder) {
        state.displayOrder = quizConfig.randomizeChoices
          ? shuffledOrder(quizConfig.questions[questionIndex].choices.length)
          : [0, 1, 2, 3];
      }
      return state.displayOrder;
    }

    function scoreSummary() {
      const answered = questionStates.filter(state => state.answered);
      const correct = answered.filter((state, index) =>
        state.selectedAnswer === quizConfig.questions[index].correctAnswer
      ).length;
      const wrong = answered.length - correct;
      return { correct, wrong, remaining: quizConfig.questions.length - answered.length, score: correct };
    }

    function updateStats() {
      const summary = scoreSummary();
      document.getElementById("correct-stat").textContent = summary.correct;
      document.getElementById("wrong-stat").textContent = summary.wrong;
      document.getElementById("remaining-stat").textContent = summary.remaining;
      document.getElementById("score-stat").textContent = `${summary.score.toFixed(2)} /20`;
    }

    function sound(type) {
      if (!quizConfig.enableSounds || !window.AudioContext && !window.webkitAudioContext) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      const context = new AudioContextClass();
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      const frequencies = { correct: 620, wrong: 180, completed: 760 };
      oscillator.frequency.value = frequencies[type] || 440;
      oscillator.type = type === "wrong" ? "sine" : "triangle";
      gain.gain.setValueAtTime(0.0001, context.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.11, context.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + (type === "completed" ? 0.45 : 0.22));
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start();
      oscillator.stop(context.currentTime + (type === "completed" ? 0.46 : 0.24));
    }

    // Reusable Type A renderer for all eight levels.
    function renderQuestion() {
      const question = quizConfig.questions[currentQuestionIndex];
      const state = questionStates[currentQuestionIndex];
      const order = getFixedDisplayOrder(currentQuestionIndex);

      document.getElementById("instruction-box").textContent = question.question;
      document.getElementById("task-box").textContent = question.task;
      document.getElementById("question-counter").textContent = `${currentQuestionIndex + 1} / ${quizConfig.questions.length}`;

      const choicesGrid = document.getElementById("choices-grid");
      choicesGrid.replaceChildren();

      order.forEach((choiceIndex, displayIndex) => {
        const choice = question.choices[choiceIndex];
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice-tile";
        button.dataset.choice = choice;
        button.disabled = state.answered;
        button.setAttribute("aria-label", `Option ${displayIndex + 1}: ${choice}`);

        if (state.answered && choice === question.correctAnswer) button.classList.add("correct");
        if (state.answered && choice === state.selectedAnswer && choice !== question.correctAnswer) button.classList.add("incorrect");

        button.innerHTML = `<span class="choice-letter">${String.fromCharCode(65 + displayIndex)}</span><span>${choice}</span>`;
        button.addEventListener("click", () => selectAnswer(choice));
        choicesGrid.appendChild(button);
      });

      const hintText = document.getElementById("hint-text");
      hintText.textContent = question.hint;
      hintText.hidden = !state.hintVisible;
      document.getElementById("hint-button").hidden = state.answered;
      document.getElementById("hint-button").onclick = () => {
        state.hintVisible = true;
        hintText.hidden = false;
      };

      const feedback = document.getElementById("feedback");
      const explanation = document.getElementById("explanation");

      if (state.answered) {
        const isCorrect = state.selectedAnswer === question.correctAnswer;
        feedback.hidden = false;
        feedback.className = `feedback ${isCorrect ? "good" : "bad"}`;
        feedback.textContent = isCorrect
          ? correctFeedback[currentQuestionIndex % correctFeedback.length]
          : incorrectFeedback[currentQuestionIndex % incorrectFeedback.length];
        explanation.hidden = false;
        explanation.textContent = `Explanation: ${question.explanation}`;
      } else {
        feedback.hidden = true;
        explanation.hidden = true;
      }

      document.getElementById("previous-button").disabled = currentQuestionIndex === 0;
      document.getElementById("next-button").disabled = !state.answered;
      updateStats();
    }

    function selectAnswer(answer) {
      const state = questionStates[currentQuestionIndex];
      if (state.answered) return;

      state.selectedAnswer = answer;
      state.answered = true;

      const isCorrect = answer === quizConfig.questions[currentQuestionIndex].correctAnswer;
      sound(isCorrect ? "correct" : "wrong");
      renderQuestion();
    }

    function movePrevious() {
      if (currentQuestionIndex === 0) return;
      currentQuestionIndex -= 1;
      renderQuestion();
    }

    function moveNext() {
      if (!questionStates[currentQuestionIndex].answered) return;
      if (currentQuestionIndex === quizConfig.questions.length - 1) {
        finishQuiz();
        return;
      }
      currentQuestionIndex += 1;
      renderQuestion();
    }

    function getRemark(score) {
      if (score <= 10.99) {
        return {
          title: "Keep Practising",
          description: "Review the three tenses one at a time: Past Simple for a finished action, Past Perfect Simple for an earlier finished action, and Past Perfect Continuous for an earlier ongoing activity."
        };
      }
      if (score <= 14.99) {
        return {
          title: "Good Progress",
          description: "You understand the basics, but you need more practice deciding which of the three tenses a context actually calls for."
        };
      }
      if (score <= 17.99) {
        return {
          title: "Very Good",
          description: "You handle most timelines and contexts well. Review the Perfect Simple vs. Perfect Continuous distinction."
        };
      }
      return {
        title: "Excellent",
        description: "You have a very strong command of all three past tenses and when to use each one."
      };
    }

    function levelBreakdown() {
      return Object.keys(levelNames).map(level => {
        const numericLevel = Number(level);
        const levelQuestions = quizConfig.questions.filter(question => question.level === numericLevel);
        const correct = levelQuestions.filter(question => {
          const index = quizConfig.questions.indexOf(question);
          return questionStates[index].selectedAnswer === question.correctAnswer;
        }).length;
        return { level: numericLevel, name: levelNames[numericLevel], correct, total: levelQuestions.length };
      });
    }

    function animateRemark(remark) {
      const slot = document.getElementById("remark-slot");
      const cycle = ["Keep Practising", "Good Progress", "Very Good", "Excellent"];
      let step = 0;
      const timer = setInterval(() => {
        slot.textContent = cycle[step % cycle.length];
        step += 1;
        if (step >= 15) {
          clearInterval(timer);
          slot.textContent = remark.title;
        }
      }, 200);
    }

    function launchConfetti() {
      const layer = document.getElementById("confetti-layer");
      layer.replaceChildren();
      const colors = ["#2563eb", "#16803c", "#f1b720", "#d54040", "#1e3a5f"];
      for (let index = 0; index < 90; index += 1) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[index % colors.length];
        piece.style.animationDelay = `${Math.random() * 450}ms`;
        layer.appendChild(piece);
      }
      setTimeout(() => layer.replaceChildren(), 3500);
    }

    function finishQuiz() {
      finalTime = quizTimer.getTime();
      quizTimer.pause();

      const summary = scoreSummary();
      const remark = getRemark(summary.score);
      const storedBest = Number(localStorage.getItem("tenseQuizBestScore") || 0);
      const attempts = Number(localStorage.getItem("tenseQuizAttempts") || 0) + 1;
      const bestScore = Math.max(storedBest, summary.score);

      localStorage.setItem("tenseQuizBestScore", bestScore.toFixed(2));
      localStorage.setItem("tenseQuizAttempts", String(attempts));
      localStorage.setItem("tenseQuizLastScore", summary.score.toFixed(2));
      localStorage.setItem("tenseQuizTimeTaken", quizTimer.format(finalTime));

      document.getElementById("quiz-screen").hidden = true;
      document.getElementById("review-screen").hidden = true;
      document.getElementById("result-page").hidden = false;
      document.getElementById("result-meta").textContent = `QUIZ • UNIT ${quizConfig.unit} • ${quizConfig.title} • ${quizConfig.lesson}`;
      document.getElementById("final-score-badge").textContent = `${summary.score.toFixed(2)} /20`;
      document.getElementById("remark-description").textContent = remark.description;

      const accuracy = ((summary.correct / quizConfig.questions.length) * 100).toFixed(2);
      const summaryItems = [
        ["Final Score", `${summary.score.toFixed(2)} /20`],
        ["Correct Answers", String(summary.correct)],
        ["Wrong Answers", String(summary.wrong)],
        ["Accuracy Percentage", `${accuracy}%`],
        ["Time Taken", quizTimer.format(finalTime)],
        ["Number of Attempts", String(attempts)],
        ["Best Score", `${bestScore.toFixed(2)} /20`]
      ];

      const summaryGrid = document.getElementById("summary-grid");
      summaryGrid.replaceChildren();
      summaryItems.forEach(([label, value]) => {
        const item = document.createElement("div");
        item.className = "summary-item";
        item.innerHTML = `<div class="summary-label">${label}</div><div class="summary-value">${value}</div>`;
        summaryGrid.appendChild(item);
      });

      const breakdownList = document.getElementById("breakdown-list");
      breakdownList.replaceChildren();
      levelBreakdown().forEach(item => {
        const row = document.createElement("div");
        row.className = "breakdown-row";
        row.innerHTML = `<span>Level ${item.level} — ${item.name}</span><strong>${item.correct}/${item.total}</strong>`;
        breakdownList.appendChild(row);
      });

      animateRemark(remark);
      sound("completed");
      if (quizConfig.showConfetti && summary.score >= 18) launchConfetti();
    }

    function renderReview() {
      document.getElementById("result-page").hidden = true;
      document.getElementById("review-screen").hidden = false;
      const content = document.getElementById("review-content");
      content.replaceChildren();

      Object.keys(levelNames).forEach(level => {
        const numericLevel = Number(level);
        const heading = document.createElement("h2");
        heading.className = "review-level";
        heading.textContent = `Level ${numericLevel} — ${levelNames[numericLevel]}`;
        content.appendChild(heading);

        quizConfig.questions.forEach((question, index) => {
          if (question.level !== numericLevel) return;
          const state = questionStates[index];
          const isCorrect = state.selectedAnswer === question.correctAnswer;
          const card = document.createElement("article");
          card.className = "review-card";
          card.innerHTML = `
            <div class="review-task">${index + 1}. ${question.task}</div>
            <div class="review-answer ${isCorrect ? "right" : "wrong"}"><strong>Student Answer:</strong> ${state.selectedAnswer || "No answer"}</div>
            <div class="review-answer right"><strong>Correct Answer:</strong> ${question.correctAnswer}</div>
            <div class="review-explanation"><strong>Explanation:</strong> ${question.explanation}</div>
          `;
          content.appendChild(card);
        });
      });
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      questionStates = createInitialStates();
      finalTime = 0;
      quizTimer.reset();
      document.getElementById("result-page").hidden = true;
      document.getElementById("review-screen").hidden = true;
      document.getElementById("quiz-screen").hidden = false;
      renderQuestion();
      quizTimer.start();
    }

    function buildReport() {
      const summary = scoreSummary();
      const levels = levelBreakdown()
        .map(item => `Level ${item.level} — ${item.name}: ${item.correct}/${item.total}`)
        .join("\n");

      return [
        "3-TENSE MASTERY CHALLENGE",
        `Unit: ${quizConfig.unit}`,
        `Lesson: ${quizConfig.lesson}`,
        "",
        `Final Score: ${summary.score.toFixed(2)} /20`,
        `Correct Answers: ${summary.correct}`,
        `Wrong Answers: ${summary.wrong}`,
        `Accuracy: ${((summary.correct / 20) * 100).toFixed(2)}%`,
        `Time Taken: ${quizTimer.format(finalTime)}`,
        "",
        "Per-Level Breakdown",
        levels
      ].join("\n");
    }

    function saveResults() {
      const blob = new Blob([buildReport()], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "3-tense-mastery-results.txt";
      link.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("previous-button").addEventListener("click", movePrevious);
    document.getElementById("next-button").addEventListener("click", moveNext);
    document.getElementById("review-button").addEventListener("click", renderReview);
    document.getElementById("restart-button").addEventListener("click", restartQuiz);
    document.getElementById("back-results-button").addEventListener("click", () => {
      document.getElementById("review-screen").hidden = true;
      document.getElementById("result-page").hidden = false;
    });
    document.getElementById("print-button").addEventListener("click", () => window.print());
    document.getElementById("save-button").addEventListener("click", saveResults);

    document.addEventListener("keydown", event => {
      if (document.getElementById("quiz-screen").hidden) return;

      const activeElement = document.activeElement;
      const isTyping = activeElement && ["INPUT", "TEXTAREA"].includes(activeElement.tagName);
      if (isTyping) return;

      if (["1", "2", "3", "4"].includes(event.key)) {
        const choices = [...document.querySelectorAll(".choice-tile")];
        const choiceButton = choices[Number(event.key) - 1];
        if (choiceButton && !choiceButton.disabled) choiceButton.click();
      }

      if (event.key === "ArrowLeft") movePrevious();
      if (event.key === "ArrowRight") moveNext();
      if ((event.key === "Enter" || event.key === " ") && document.activeElement?.classList.contains("choice-tile")) {
        event.preventDefault();
        document.activeElement.click();
      }
    });

    questionStates = createInitialStates();
    quizTimer.reset();
    renderQuestion();
    quizTimer.start();
  </script>
