  <script>
    /* Quiz configuration and supplied question data */
    const quizConfig = {
      unit:"UNIT 3",title:"EDUCATION",lesson:"VOCABULARY - QUIZ 2",teacherName:"Teacher Soufiane",
      teacherImage:"https://i.imgur.com/vvyZAnr.png",logo:"https://imgur.com/XPOYllA",
      randomizeQuestions:false,randomizeChoices:true,timerEnabled:true,timerMode:"countup",countdownSeconds:600,showConfetti:true,enableSounds:true,
      questions:[
        ["single-choice","Choose the word that matches the definition","CHOOSE THE TYPE OF EDUCATION THAT BEST MATCHES THE DEFINITION.","Structured education that takes place in schools or colleges and leads to a recognized qualification.",["formal education","informal education","gifted education","non-formal education"],"formal education","Formal education is structured, school-based learning that leads to an official qualification."],
        ["single-choice","Choose the word that matches the definition","CHOOSE THE WORD THAT MATCHES THE DEFINITION.","Learning gained through everyday experience, without a set curriculum or formal instruction.",["informal education","formal education","gifted education","special education"],"informal education","Informal education happens naturally through daily life experiences, without a structured curriculum."],
        ["single-choice","Choose the word that matches the definition","CHOOSE THE WORD THAT MATCHES THE DEFINITION.","Programs designed to challenge and support exceptionally talented or intelligent students.",["gifted education","informal education","formal education","basic education"],"gifted education","Gifted education provides extra challenge and support for exceptionally talented students."],
        ["single-choice","Choose the word that matches the definition","CHOOSE THE WORD THAT MATCHES THE DEFINITION.","The inability to read or write.",["illiteracy","literacy","ignorance","dropouts"],"illiteracy","Illiteracy refers to a person's inability to read or write."],
        ["single-choice","Put the word in brackets in its correct form","PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.","Students must obtain a professional ______ before they can start teaching. (certify)",["certification","certify","certified","certifying"],"certification","We need a noun after 'professional', so the verb 'certify' becomes 'certification'."],
        ["single-choice","Put the word in brackets in its correct form","PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.","Lina prefers to watch ______ documentaries instead of cartoons. (education)",["educational","education","educate","educated"],"educational","We need an adjective before 'documentaries', so 'education' becomes 'educational'."],
        ["single-choice","Put the word in brackets in its correct form","PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.","After four years at university, she finally attended her ______ ceremony. (graduate)",["graduation","graduate","graduated","graduating"],"graduation","We need a noun before 'ceremony', so the verb 'graduate' becomes 'graduation'."],
        ["single-choice","Put the word in brackets in its correct form","PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.","All new students must complete their ______ before the semester begins. (register)",["registration","register","registered","registering"],"registration","We need a noun after 'their', so the verb 'register' becomes 'registration'."],
        ["single-choice","Fill in the gap with the appropriate word from the list","FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.","______ is important for building a bright future.",["Education","Literacy","Decrease","Increase"],"Education","'Education' fits because the sentence talks about its importance for a good future."],
        ["single-choice","Fill in the gap with the appropriate word from the list","FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.","Reading programs in rural areas have helped improve adult ______ rates significantly.",["literacy","education","decrease","increase"],"literacy","'Literacy' fits because the sentence discusses the ability to read and write."],
        ["single-choice","Fill in the gap with the appropriate word from the list","FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.","Extra tutoring helped to ______ the number of students struggling with math.",["decrease","increase","literacy","education"],"decrease","'Decrease' fits because tutoring reduced the number of struggling students."],
        ["single-choice","Fill in the gap with the appropriate word from the list","FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.","New scholarship programs have led to a significant ______ in university enrollment.",["increase","decrease","literacy","education"],"increase","'Increase' fits because scholarships led to more students enrolling."],
        ["single-choice","Choose the word that completes the collocation","CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.","Culture for All is an organization which ______ citizens to the importance of adult literacy.",["sensitizes","informs","teaches","educates"],"sensitizes","'Sensitize citizens to' is the correct natural collocation meaning to raise awareness."],
        ["single-choice","Choose the word that completes the collocation","CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.","Vocational education helps students ______ into the job market easily.",["integrate","enter","join","register"],"integrate","'Integrate into the job market' is the correct natural collocation meaning to successfully join the workforce."],
        ["single-choice","Choose the word that completes the collocation","CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.","She has enrolled ______ a medical school to pursue a medical career.",["in","on","at","to"],"in","'Enroll in' is the correct natural collocation meaning to register for a school."],
        ["single-choice","Choose the word that completes the collocation","CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.","As children grow up, they look for more autonomy; they want to make their own ______.",["choices","decisions","opinions","options"],"choices","'Make your own choices' is the correct natural collocation meaning to decide for yourself."],
        ["three-synonyms","Three Synonyms Challenge","SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.","SUCCESSFUL",["victorious","accomplished","triumphant","unsuccessful"],["victorious","accomplished","triumphant"],"unsuccessful","'Victorious', 'accomplished', and 'triumphant' are synonyms of successful. 'Unsuccessful' is its antonym."],
        ["three-synonyms","Three Synonyms Challenge","SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.","AUTONOMOUS",["independent","self-governing","self-reliant","dependent"],["independent","self-governing","self-reliant"],"dependent","'Independent', 'self-governing', and 'self-reliant' are synonyms of autonomous. 'Dependent' is its antonym."],
        ["three-synonyms","Three Synonyms Challenge","SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.","AWARE",["conscious","informed","mindful","unaware"],["conscious","informed","mindful"],"unaware","'Conscious', 'informed', and 'mindful' are synonyms of aware. 'Unaware' is its antonym."],
        ["three-synonyms","Three Synonyms Challenge","SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.","TALENTED",["gifted","skilled","capable","incapable"],["gifted","skilled","capable"],"incapable","'Gifted', 'skilled', and 'capable' are synonyms of talented. 'Incapable' is its antonym."]
      ]
    };

    const messages={good:["Excellent!","Great Job!","Perfect!","Keep Going!"],bad:["Almost!","Review this rule.","Keep learning!","You'll get the next one!"]};
    const $=id=>document.getElementById(id);
    const shuffle=a=>[...a].sort(()=>Math.random()-.5);
    const categoryNames=["Definitions","Word Forms","Word Bank","Collocations","Synonyms Challenge"];
    let questions=[],current=0,answers=[],synonymTimer=null,completed=false;

    /* Independent timer module */
    const timer={
      seconds:0,interval:null,
      start(){if(!quizConfig.timerEnabled||this.interval)return;this.interval=setInterval(()=>{this.seconds+=quizConfig.timerMode==="countdown"?-1:1;if(this.seconds<=0&&quizConfig.timerMode==="countdown"){this.seconds=0;this.pause();finishQuiz()}this.render()},1000)},
      pause(){clearInterval(this.interval);this.interval=null},
      reset(){this.pause();this.seconds=quizConfig.timerMode==="countdown"?quizConfig.countdownSeconds:0;this.render()},
      format(){return `${String(Math.floor(this.seconds/60)).padStart(2,"0")}:${String(Math.abs(this.seconds%60)).padStart(2,"0")}`},
      render(){$("timerDisplay").textContent=this.format()}
    };

    function makeQuestions(){
      questions=quizConfig.questions.map((q,i)=>q[0]==="single-choice"?{type:q[0],category:q[1],question:q[2],task:q[3],choices:[...q[4]],correctAnswer:q[5],explanation:q[6],points:1,group:Math.floor(i/4)}:{type:q[0],category:q[1],question:q[2],targetWord:q[3],options:[...q[4]],correctSynonyms:q[5],antonym:q[6],explanation:q[7],points:1,group:4});
    }
    function play(type){
      if(!quizConfig.enableSounds||!window.AudioContext)return;
      const ctx=new AudioContext(),osc=ctx.createOscillator(),gain=ctx.createGain();
      const tones={good:[660,880],bad:[180,130],click:[420,520],end:[523,659]}[type]||[440,440];
      osc.frequency.value=tones[0];gain.gain.setValueAtTime(.05,ctx.currentTime);osc.connect(gain);gain.connect(ctx.destination);osc.start();
      setTimeout(()=>{osc.frequency.value=tones[1];},90);setTimeout(()=>{gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.15);osc.stop(ctx.currentTime+.16);ctx.close()},170);
    }
    function getScore(){return answers.filter(a=>a&&a.correct).length}
    function renderQuestion(){
      const q=questions[current],a=answers[current];clearTimeout(synonymTimer);
      $("categoryLabel").textContent=q.category;$("instruction").textContent=q.question;$("counter").textContent=`${current+1} / ${questions.length}`;
      $("taskBox").innerHTML=q.type==="single-choice"?q.task:`<span class="target-word">${q.targetWord}</span>`;
      $("choices").innerHTML="";$("feedback").className="feedback";
      q.type==="single-choice"?renderSingle(q,a):renderSynonyms(q,a);
      if(a)showFeedback(q,a);$("previousBtn").disabled=current===0;$("nextBtn").disabled=!a;
      updateStats();
    }
    function renderSingle(q,a){
      q.choices.forEach((choice,i)=>{const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=`${i+1}. ${choice}`;b.disabled=!!a;
        if(a){if(choice===q.correctAnswer)b.classList.add("correct");if(choice===a.selected&&!a.correct)b.classList.add("wrong")}
        b.onclick=()=>answerSingle(choice);$("choices").appendChild(b)});
    }
    function answerSingle(choice){if(answers[current])return;const q=questions[current],correct=choice===q.correctAnswer;answers[current]={selected:choice,correct};play(correct?"good":"bad");renderQuestion()}
    function renderSynonyms(q,a){
      const selected=a?a.selected:[];q.options.forEach((option,i)=>{const b=document.createElement("button");b.type="button";b.className="choice";b.innerHTML=`${i+1}. ${option}`;
        if(answers[current]){b.disabled=true;if(q.correctSynonyms.includes(option))b.classList.add("correct");if(!a.correct&&selected.includes(option)&&!q.correctSynonyms.includes(option))b.classList.add("wrong");if(option===q.antonym&&!selected.includes(option)){b.classList.add("muted");b.innerHTML+=` <span class="tag">antonym</span>`}if(option===q.antonym&&selected.includes(option))b.innerHTML+=` <span class="tag">antonym, not a synonym</span>`}
        else if(selected.includes(option))b.classList.add("selected");
        b.onclick=()=>toggleSynonym(option);$("choices").appendChild(b)});
    }
    /* Three-selection evaluation: users may deselect within the 500ms grace period. */
    function toggleSynonym(option){
      if(answers[current])return;let selected=window.pendingSynonyms||[];
      selected=selected.includes(option)?selected.filter(x=>x!==option):selected.length<3?[...selected,option]:selected;
      window.pendingSynonyms=selected;play("click");renderQuestionNoReset();
      clearTimeout(synonymTimer);if(selected.length===3)synonymTimer=setTimeout(()=>evaluateSynonyms(selected),500);
    }
    function renderQuestionNoReset(){
      const q=questions[current];$("choices").innerHTML="";renderSynonyms(q,{selected:[...(window.pendingSynonyms||[])],correct:false});
    }
    function evaluateSynonyms(selected){
      if(selected.length!==3||answers[current])return;const q=questions[current],correct=q.correctSynonyms.every(x=>selected.includes(x));answers[current]={selected:[...selected],correct};window.pendingSynonyms=[];play(correct?"good":"bad");renderQuestion();
    }
    function showFeedback(q,a){const f=$("feedback");f.className=`feedback show ${a.correct?"good":"bad"}`;f.innerHTML=`<strong>${a.correct?messages.good[Math.floor(Math.random()*4)]:messages.bad[Math.floor(Math.random()*4)]}</strong>${q.explanation}`}

    function updateStats(){const score=getScore(),answered=answers.filter(Boolean).length;$("correctCount").textContent=score;$("wrongCount").textContent=answered-score;$("scoreText").textContent=`${score.toFixed(2)} /20`;$("remainingCount").textContent=20-answered;$("progressFill").style.width=`${answered/20*100}%`}
    function renderNavigator(){
      const nav=$("navigator");nav.innerHTML="";for(let g=0;g<5;g++){const group=document.createElement("div");group.className="nav-group";questions.forEach((q,i)=>{if(q.group!==g)return;const b=document.createElement("button");b.type="button";b.className=`q-dot ${answers[i]?"answered":""} ${i===current?"current":""}`;b.textContent=i+1;b.onclick=()=>{current=i;window.pendingSynonyms=[];renderQuestion()};group.appendChild(b)});nav.appendChild(group)}
    }
    function navigate(direction){if(!answers[current]&&direction>0)return;if(direction<0&&current>0){current--;window.pendingSynonyms=[];renderQuestion()}else if(direction>0&&current<19){current++;window.pendingSynonyms=[];renderQuestion()}else if(direction>0&&current===19)finishQuiz()}
    function finalRemark(score){return score<10?"Fail":score<12?"Pass":score<14?"Fairly Good":score<16?"Good":score<18?"Very Good":"Excellent!"}
    function animateRemark(target){const list=["Fail","Pass","Fairly Good","Good","Very Good","Excellent!"];let n=0;const step=()=>{if(n++<20){$("remark").textContent=list[n%list.length];setTimeout(step,60+n*9)}else $("remark").textContent=target};step()}
    function finishQuiz(){
      if(completed)return;completed=true;timer.pause();$("quizView").style.display="none";$("resultScreen").classList.add("show");
      const score=getScore(),wrong=20-score,accuracy=(score/20*100).toFixed(2),priorAttempts=Number(localStorage.getItem("eduQuizAttempts")||0),best=Math.max(score,Number(localStorage.getItem("eduQuizBest")||0));
      localStorage.setItem("eduQuizAttempts",priorAttempts+1);localStorage.setItem("eduQuizBest",best);localStorage.setItem("eduQuizLast",score);localStorage.setItem("eduQuizTime",timer.format());
      $("finalScore").textContent=`${score.toFixed(2)} /20`;$("scoreCircle").style.setProperty("--score",`${score/20*100}%`);
      $("summaryGrid").innerHTML=[["Final Score",`${score.toFixed(2)} /20`],["Correct Answers",score],["Wrong Answers",wrong],["Accuracy Percentage",`${accuracy}%`],["Time Taken",timer.format()],["Number of Attempts",priorAttempts+1],["Best Score",`${best.toFixed(2)} /20`]].map(x=>`<div class="summary-item">${x[0]}<b>${x[1]}</b></div>`).join("");
      $("breakdown").innerHTML=`<h3>Performance Summary</h3>${categoryNames.map((name,g)=>`<div class="break-row"><span>${name}</span><b>${questions.filter((q,i)=>q.group===g&&answers[i]?.correct).length}/4</b></div>`).join("")}`;
      animateRemark(finalRemark(score));play("end");if(score>=16&&quizConfig.showConfetti)confetti();
    }
    function confetti(){const box=$("confetti");box.innerHTML="";["#159447","#1267bd","#f5b942","#d83a3a","#7b49be"].forEach((c,k)=>{for(let i=0;i<22;i++){const b=document.createElement("i");b.className="confetti-bit";b.style.background=c;b.style.left=Math.random()*100+"%";b.style.top="-20px";b.style.setProperty("--drift",(Math.random()*180-90)+"px");b.style.animationDelay=(Math.random()*.7)+"s";box.appendChild(b)}});setTimeout(()=>box.innerHTML="",4500)}
    function renderReview(){
      $("resultScreen").classList.remove("show");$("reviewScreen").classList.add("show");let html="";
      for(let g=0;g<5;g++){html+=`<div class="review-group"><h3>${categoryNames[g]} (${questions.filter((q,i)=>q.group===g&&answers[i]?.correct).length}/4)</h3>`;
        questions.forEach((q,i)=>{if(q.group!==g)return;const a=answers[i],student=q.type==="single-choice"?a.selected:a.selected.join(", "),correct=q.type==="single-choice"?q.correctAnswer:q.correctSynonyms.join(", ");
          html+=`<article class="review-item ${a.correct?"correct-review":"wrong-review"}"><p><b>Question ${i+1}:</b> ${q.type==="single-choice"?q.task:`Target Word: ${q.targetWord}`}</p><p>Student Answer: <span class="${a.correct?"answer-good":"answer-bad"}">${student}</span></p><p>Correct Answer: <span class="answer-good">${correct}</span></p>${q.type==="three-synonyms"?`<p>Antonym distractor: <span class="answer-bad">${q.antonym}</span></p>`:""}<p><b>Explanation:</b> ${q.explanation}</p></article>`});html+="</div>"}$("reviewContent").innerHTML=html}
    function saveResults(){const text=`${quizConfig.title} — ${quizConfig.lesson}\nFinal Score: ${getScore().toFixed(2)} /20\nCorrect: ${getScore()} | Wrong: ${20-getScore()}\nTime Taken: ${timer.format()}\n\n${categoryNames.map((n,g)=>`${n}: ${questions.filter((q,i)=>q.group===g&&answers[i]?.correct).length}/4`).join("\n")}`;const blob=new Blob([text],{type:"text/plain"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="education-vocabulary-quiz-results.txt";a.click();URL.revokeObjectURL(url)}
    function restart(){completed=false;current=0;answers=[];window.pendingSynonyms=[];$("resultScreen").classList.remove("show");$("reviewScreen").classList.remove("show");$("quizView").style.display="grid";makeQuestions();timer.reset();timer.start();renderQuestion()}
    $("previousBtn").onclick=()=>navigate(-1);$("nextBtn").onclick=()=>navigate(1);$("reviewBtn").onclick=renderReview;$("backResultBtn").onclick=()=>{$("reviewScreen").classList.remove("show");$("resultScreen").classList.add("show")};$("restartBtn").onclick=restart;$("printBtn").onclick=()=>window.print();$("saveBtn").onclick=saveResults;
    document.addEventListener("keydown",e=>{if(completed)return;const q=questions[current];if(["1","2","3","4"].includes(e.key)){e.preventDefault();const opts=q.type==="single-choice"?q.choices:q.options;const choice=opts[Number(e.key)-1];if(q.type==="single-choice")answerSingle(choice);else toggleSynonym(choice)}if(e.key==="ArrowLeft")navigate(-1);if(e.key==="ArrowRight"||e.key==="Enter"||e.key===" ")navigate(1)});
    makeQuestions();timer.reset();timer.start();renderQuestion();
  </script>
 
</body></html>
